    source: "report §6 p.6 'Audio 6 The UAV was tele-operated by a human and was performing free-flights combining sequences of take-off, stabilization, hovering, and landing'"
    confidence: high
open_questions:
  - >-
    4 vs 3 channels: the dataset page lists 4 audio channels, but the report says three
    microphones (§2, §3.2, §4, Fig. 2-3) and every file has 3 channels. The page's '4' is
    wrong; no channel is missing.
  - >-
    Recordings 1 and 5 (running drone carried by hand): not airborne, not fixed, the rig
    moves (Doppler/orientation changes) and the rotor speed is not held constant (measured
    spin-up and wander). Tagged condition=handheld (added to the vocabulary for exactly
    this case) rather than bench.
  - >-
    The report contradicts itself: the §6 summary paragraph says recording 4 is the
    hand-carried one, while the per-recording list says 4 is stationary at constant speed
    and 1 and 5 are hand-carried. The per-recording list was followed; §7 and Fig. 5 (4 =
    stationary, constant speed, 35 Hz comb) and the measured lower speed/level of 4 agree
    with it.
  - >-
    §6 states 'total weight of the equipped system is 0.88 kg' and 'propellers' speed ranges
    from 10 turns/s ... up to around 75 turns/s', which looks copied from the SP Cup/DREGON
    description: Table 1 gives 0.16 kg for this drone and no speed measurement exists.
  - >-
    Channel order (wav channel i = mic i+1) is assumed. The three mics went through three
    separate USB sound cards, so sample-accurate synchronisation is not guaranteed: the
    100-2000 Hz envelope cross-correlation peaks within ~1 ms in recording 4 but at 20-56 ms
    (weak peaks) in recording 2; inter-channel coherence is low throughout.
  - >-
    Rotor positions are estimated from a photo (x/y) and a guess (z); the drone's forward
    direction is not stated. 'Stationary' in recording 4 presumably means resting on the
    floor (not stated).
