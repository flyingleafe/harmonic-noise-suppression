    source: "report §6 p.6 'Audio 3 ... free-flights combining sequences of take-off, stabilization, spinning, and landing'"
    confidence: high
  - key: Maverick__4
    raw: "Maverick/4.wav"
    geometry: yh19hw_tri3
    condition: bench
    flight_mode: null
    contains_rotor_noise: true
    n_active_rotors: 4
    external_source: none
    throttle_or_speed: "constant speed; report Fig. 5: harmonics of ~35 Hz (peaks 35, 71, 108, 173 Hz); measured Welch peaks ~37.3, ~69.6, ~75.0 Hz (two slightly different rotor speeds)"
    channels_used: null
    description: >-
      All four motors running at a constant speed with the drone stationary (it did not take
      off). Lower speed than in flight (comb ~37/75 Hz vs ~85-100 Hz, level ~10 dB below the
      flight files: -19 to -25 dBFS vs -6 to -14 dBFS). 16.0 s.
    source: "report §6 p.6 'Audio 4 The UAV motors were turned on and rotated at a constant speed but the drone did not take any flight rather it was stationary', §7 p.6-7 ('the UAV was stationary, but all the four motors were turned on') and Fig. 5; RMS and PSD measured on the wav"
    confidence: high
  - key: Maverick__5
    raw: "Maverick/5.wav"
    geometry: yh19hw_tri3
    condition: handheld
    flight_mode: null
    contains_rotor_noise: true
    n_active_rotors: 4
    external_source: none
    throttle_or_speed: "not reported; measured comb wanders ~84-104 Hz"
    channels_used: null
