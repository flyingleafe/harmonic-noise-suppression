team: Maverick
report: "SPCUP19_Maverick_documentation.pdf"
supplementary:
  - "dataset page /tmp/spcup_page.txt (Team Maverick entry: 'Quadcopter UAV (YH-19HW ...)', '4' audio channels)"
  - "report embedded images: Fig. 1 p.3 (product photo), Fig. 2 p.4 (bottom/top photos, extracted at 1535x2046 with pdfimages), Fig. 3 p.5 (array drawing), Fig. 5 p.7 (spectrum)"
  - "Maverick/*.wav (headers via soxi; RMS, inter-channel coherence/cross-correlation and per-second harmonic-comb f0 track measured by the annotator)"
  - "no other supplementary files ship in the team package (only the six wavs)"
summary: >-
  BUET (Bangladesh) recorded a small foldable toy quadcopter (YH-19HW, brushed motors, 160 g)
  inside an anechoic chamber with three omnidirectional lavalier microphones taped in a
  triangle under the body, wired to a laptop through three USB sound cards (44.1 kHz,
  16 bit). Six recordings: three tele-operated free flights (take-off, stabilisation,
  hovering or spinning, landing), one with the motors on at constant speed while the drone
  stays on the ground, and two in which a person carries the running drone around by hand.
  No external sound source was used.
drone:
  make_model: "YH-19HW foldable toy quadcopter (brushed motors)"
  n_rotors: 4
  source: "report §3.1 p.1-2 + Table 1 p.2 ('quadcopter UAV YH-19HW ... four brushed motors', 0.16 kg, 21.0 x 16.5 x 8.0 cm); dataset page"
frame:
  description: >-
    report Fig. 3 frame: origin = centre of the drone body (crosshair in Fig. 3), x =
    across the body (to the right in the Fig. 3 top view), y = along the body's long axis
    towards microphones 1-2 (away from the protrusion drawn at the other end), z = up;
    metres (converted from the report's cm), right-handed.
  source: "report §4 p.4-5 and Fig. 3 p.5 (axes x, y, z-out-of-page drawn; mics below the body have negative z, so the drawing is a top view with z up)"
geometry:
  yh19hw_tri3:
    mic_pos:
      - [-0.0256, 0.0422, -0.0052]  # file ch 0 = mic (1)
      - [0.0256, 0.0422, -0.0052]   # file ch 1 = mic (2)
      - [0.0, -0.0422, -0.0112]     # file ch 2 = mic (3)
    mic_pos_quality: reported
    channel_map_source: >-
      assumption: wav channel i = microphone (i+1) of Fig. 3 (the report numbers the mics 1-3
      but never states the channel order; each mic went to its own USB sound card and the
      3-channel file was assembled afterwards). Not verifiable from the data: the rotor noise
      is only weakly coherent between channels (median 20-1000 Hz coherence 0.03-0.06).
    rotor_pos:
      - [0.070, 0.075, 0.025]
      - [-0.072, 0.076, 0.025]
      - [-0.073, -0.071, 0.025]
      - [0.069, -0.067, 0.025]
    rotor_pos_quality: estimated
    source: >-
      mic_pos: report Fig. 3 p.5 'Microphone co-ordinates' (1) (-2.56, 4.22, -0.52),
      (2) (2.56, 4.22, -0.52), (3) (0, -4.22, -1.12) cm. rotor_pos x/y: measured by the
      annotator on the report's Fig. 2 bottom photo (pdfimages, 1535 px wide): motor-hub
      centres relative to the mic-triangle origin, scaled by the reported mic spacings
      (mic1-mic2 5.12 cm = 217 px, mic-pair-to-mic3 8.44 cm = 368 px -> ~43 px/cm), then
      mapped into the Fig. 3 frame (photo right = +y towards the mic pair; bottom view
      mirrored so photo up = +x). Result: roughly square ~0.14 x 0.14 m motor layout, which
      matches the product photo Fig. 1 (motor spacing across ~= along, within 2 %). rotor z:
      guessed propeller plane ~2.5 cm above the origin (drone height 8 cm, Table 1; props sit
      on the motor tops at the arm ends); not measured.
    notes: >-
      Report Fig. 3's drawing is schematic (its rotor placement is not to scale with the mic
      coordinates), so it was not used for rotor positions. rotor_pos uncertainty ~+-0.01 m
      in x/y (photo perspective, hub centring) and ~+-0.02 m in z. Rotor order: (+x,+y),
      (-x,+y), (-x,-y), (+x,-y) - annotator's choice, the report has no motor numbering.
      Swapping mic 1 and mic 2 (unknown left/right in the bottom photo) only mirrors x, which
      leaves this near-symmetric rotor set unchanged within its uncertainty. Which end is
      the drone's nose is not stated.
recordings:
