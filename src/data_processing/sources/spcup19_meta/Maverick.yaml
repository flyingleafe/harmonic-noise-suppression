    geometry: yh19hw_tri3
    condition: handheld
    flight_mode: null
    contains_rotor_noise: true
    n_active_rotors: 4
    external_source: none
    throttle_or_speed: "not reported; measured comb ~33-36 Hz for the first ~4 s, then ~92-100 Hz (brief dip to ~35-72 Hz at 14-16 s)"
    channels_used: null
    description: >-
      Motors on, not flying: a human operator carried the running drone around by hand 'to
      simulate motion' in the anechoic chamber. Speed ramps up after ~4 s and dips once
      mid-file. 27.0 s.
    source: "report §6 p.6 'Audio 1 The UAV motors were turned on and a human operator carried the it to simulate motion'; f0 track measured on the wav"
    confidence: medium
