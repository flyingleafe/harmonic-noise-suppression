  - key: Maverick__6
    raw: "Maverick/6.wav"
    geometry: yh19hw_tri3
    condition: flight
    flight_mode: mixed
    contains_rotor_noise: true
    n_active_rotors: 4
    external_source: none
    throttle_or_speed: "not reported; measured comb ~75-90 Hz"
    channels_used: null
