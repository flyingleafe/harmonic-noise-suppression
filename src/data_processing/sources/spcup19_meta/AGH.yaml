open_questions:
  - "Units of the xlsx speed values are not stated. ego-noise/mic array 100/80/60/40/20 is presumably % throttle. ego-noise/single rotors 275/225/190/160/125 gives measured shaft rates 159.5/132.6/113.7/97.6/77.7 Hz, which are not proportional to the values (ratio 0.58-0.62), so the number is a controller setting, not rev/s."
  - "Rotor positions (rotor_pos) are not documented, and acoustic mapping of the ego-noise recordings resolves only their elevation (~58-62 deg above the array centre), not their azimuth or range. Which physical rotor is 'rotor 1..4' in the single-rotor set is also undocumented."
  - "Reference-mic (AKG C451 B) position is not given anywhere; it is only visible in Fig. 2."
  - "The origin of the xlsx loudspeaker coordinates is not the array centre. The TDOA fit places the array centroid at (-0.171, +0.068, -0.107) m in that frame, and the report does not say what the xlsx origin is (e.g. the stand axis)."
  - "static clean/info.xlsx row 7 (file 5): the az/el columns (-132.7 / -15.5 deg) do not match x, y, z = (-133, -114, -54.5) cm (-139.4 / -17.3 deg); they match y = -144. The TDOA DOA of file 5 (-132 deg vs -134.2 predicted for y=-114 and -127.5 for y=-144, both relative to the fitted centre) slightly favours the x, y, z columns. The y=-114 value was kept."
  - "static corrupted: n_active_rotors=4 is inferred, because the report names only the 'all rotors' ego-noise setup for the array. Its per-channel level pattern (ch3/ch4 loudest) differs from the ego-noise/mic array files (ch2/ch6 quietest), so a partial rotor set or a different drone/array orientation cannot be excluded."
  - "static corrupted/0 ('very high speed') is labelled bench: its motor tones drift and rise sharply in the last ~1.5 s, but the xlsx gives one speed, so the variation does not look deliberate."
  - "calibration: purpose and loudspeaker position are not documented. The xlsx rows are numbered 0/1 but the files are 1.wav/2.wav; they were matched by channel count (8 ch = 'mic array', 1 ch = 'ref mic'). The two files are separate recordings of the same 64.6 s noise burst, not sample-synchronous."
  - "The array's layer gap (0.101 m) is the least certain geometry value (~+-0.03 m): all loudspeakers were only ~13-29 deg below the array (xlsx el -15.5..-29.1 deg), which constrains z weakly."
