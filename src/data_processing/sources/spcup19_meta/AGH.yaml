# SPCUP19 ego-noise corpus -- team AGH (AGH University of Science and Technology, Poland).
# `raw` paths are relative to .cache/source_raw/SPCUP19-egonoise/AGH/.
# Rotors-off sanity check: 'static clean' (AGH__static_clean__*) = rotors OFF -> CONFIRMED (report + xlsx + spectra);
# 'static corrupted' (AGH__static_corrupted__*) = rotors ON ('static with ego-noise', xlsx 'very high speed' /
# 'medium speed', +32/+35 dB rotor/downwash energy in 60-400 Hz) -> the "no active rotors" expectation is REFUTED for these 2.
team: AGH
report: SPCUP19_AGH_documentation.pdf
supplementary:
  - "calibration/info.xlsx"
  - "ego-noise/mic array/info.xlsx"
  - "ego-noise/single rotors/info.xlsx"
  - "static clean/info.xlsx"
  - "static corrupted/info.xlsx"
  - "report Fig. 2 / Fig. 3 photos (the two JPEGs embedded in SPCUP19_AGH_documentation.pdf)"
summary: >-
  Anechoic-chamber recordings of a small quadcopter fixed on a tall stand, with a home-made 8-ch low-cost electret
  array ("cube-shaped", two 4-mic layers) mounted below the drone and one AKG C451 B condenser reference mic on a
  separate stand beside it; nothing was flown. 'static clean' = loudspeaker white noise (8 positions) or speech (2)
  with the motors off; 'static corrupted' = loudspeaker white noise with all rotors running; 'ego-noise/mic array' =
  all rotors at 5 speed settings (array); 'ego-noise/single rotors' = one rotor at a time at several speeds (reference
  mic only). Two 'calibration' files capture the same broadband noise burst with the array and with the reference mic.
drone:
  make_model: "unspecified quadrotor (dataset page: 'Quadrotor UAV (unknown)'); Fig. 2 shows a small X-frame racing-type quad with 3-blade propellers"
  n_rotors: 4
  source: "report p.1 ('quadrocopter') + Fig. 2 photo; SPCup2019 ego-noise dataset page, Team AGH entry ('Drone Model: Quadrotor UAV (unknown)', 8 channels); 3 blades also from single-rotor spectra (blade-pass = 3x shaft rate)"
frame:
  description: >-
    origin = centroid of the 8 array mics (derived); x, y, z parallel to the axes of the loudspeaker coordinates in
    static clean/info.xlsx (azimuth = atan2(y, x), counter-clockwise from +x towards +y); z up, i.e. towards the drone
    (sources at z = -54.5 cm have negative elevation, and the rotor noise arrives from elevation ~ +58 deg); metres.
    The xlsx origin is NOT the array centre: the fit puts the array centroid at (-0.171, +0.068, -0.107) m in xlsx
    coordinates (leave-one-source-out sd ~0.016 m horizontally, ~0.02 m vertically) -- subtract it from an xlsx source
    position to express it in this frame. The drone's own heading/axes relative to x, y are not documented.
  source: "static clean/info.xlsx columns C-G (the az/el columns equal atan2 of the x, y, z columns in 9 of 10 rows); TDOA geometry fit (geometry.array8.source)"
geometry:
  array8:
    mic_pos:
      - [0.1033, -0.0522, -0.0505]   # ch0: lower layer
      - [0.1043, 0.0502, 0.0505]   # ch1: upper layer
      - [0.0522, 0.1033, -0.0505]   # ch2: lower layer
      - [-0.0502, 0.1043, 0.0505]   # ch3: upper layer
      - [-0.1033, 0.0522, -0.0505]   # ch4: lower layer
      - [-0.1043, -0.0502, 0.0505]   # ch5: upper layer
      - [-0.0522, -0.1033, -0.0505]   # ch6: lower layer
      - [0.0502, -0.1043, 0.0505]   # ch7: upper layer
    mic_pos_quality: derived
    channel_map_source: "derived per audio channel: each wav channel's position was fitted from that channel's own TDOAs, so row i == file channel i by construction (the team documents no channel order)"
    rotor_pos: null
    rotor_pos_quality: unknown
    source: >-
      Derived from the audio: GCC-PHAT TDOAs (all 28 pairs, 0.5 s blocks, 300 Hz-12 kHz, 1/32-sample interpolation;
      per-pair inter-quartile range over blocks <= 0.03 samples) of the 8 white-noise files 'static clean/0-7.wav' with
      the loudspeaker positions in static clean/info.xlsx C2:E9 and c = 343.2 m/s, fitted by nonlinear least squares
      with a regular 2-layer model (two horizontal 4-mic squares: common radius, per-layer rotation and height, plus a
      free horizontal offset of the xlsx origin; 7 parameters), rms TDOA residual 1.04 samples (8 mm). An unconstrained
      24-coordinate fit (rms 0.84 samples) gives the same layout within 0.3 / 0.9 / 2.3 cm (x / y / z) but is
      ill-conditioned in z. Leave-one-source-out spread: radius +-0.7 mm, layer rotations +-0.7 deg, layer heights
      +-2 cm. Held-out check: the speech files static clean/8, /9 and static corrupted/1 (not used in the fit) are
      localized by SRP-PHAT (2 deg grid) within 2.4-4.2 deg azimuth and <= 1.2 deg elevation of their xlsx positions.
    notes: >-
      Two horizontal 4-mic layers 0.101 m apart (the layer gap is the least certain quantity, ~ +-0.03 m), radius
      0.116 m. Lower layer = channels 0, 2, 4, 6 at azimuth -26.8 deg + k*90 deg; upper layer = channels 1, 3, 5, 7 at
      +25.7 deg + k*90 deg. Channels run counter-clockwise seen from above, alternating lower/upper; the two squares
      are rotated ~52 deg to each other, so each vertical side of the box carries one lower and one upper mic -- the
      report's 'cube-shaped' array. Fig. 2 is consistent (two white plates with mic boards, posts between them, the
      drone on posts above the upper plate). Scale is proportional to the assumed speed of sound (+-1 % for 15-25 C).
      Rotor positions are not documented anywhere; an SRP-PHAT / broadband-MUSIC map of the ego-noise/mic array files
      puts all rotor noise at elevation ~58-62 deg above the array centre (drone above the array), but the azimuth
      peaks (~68, 126, -132, -48 deg) have only ~1-1.5 dB contrast and the range is unresolved, so rotor_pos is null.
  ref_mic:
    mic_pos: null
    mic_pos_quality: unknown
    channel_map_source: "single-channel file (AKG C451 B reference mic)"
    rotor_pos: null
    rotor_pos_quality: unknown
    source: "report p.1 + Fig. 2 (AKG C451 B on its own stand to the right of the drone); no coordinates in any info.xlsx"
    notes: >-
      Position only visible in Fig. 2: beside the drone at roughly drone-arm / upper-array height, a few decimetres
      from the nearest rotor; not measurable. Unknown whether it stayed in place between the calibration and the
      single-rotor sessions. At the common setting 160 the single-rotor RMS is rotor 4 -20.8, rotor 1 -22.7, rotor 3
      -24.8, rotor 2 -29.3 dBFS, i.e. rotor 4 is probably the one nearest to the mic and rotor 2 the farthest
      [inference from levels only].
recordings:
  - key: "AGH__calibration__1"
    raw: "calibration/1.wav"
    geometry: "array8"
    condition: "rotors_off"
    flight_mode: null
    contains_rotor_noise: false
    n_active_rotors: 0
    external_source: "white_noise"
    throttle_or_speed: null
    channels_used: null
    description: "Calibration capture by the 8-ch array (info.xlsx row 'file 0 / signal: mic array'; the wav files are numbered 1/2 while the xlsx rows are 0/1, matched by channel count: 1.wav has 8 ch, 2.wav has 1 ch). Content: one 64.6 s broadband noise burst (on 5.3-70.0 s; spectral flatness 0.71 over 200 Hz-16 kHz; mean spectrum overlays the static-clean loudspeaker white noise), source position not given. No rotor noise: 60-400 Hz level -51.5 dBFS (static clean white noise: -50.2..-56.0), no tonal line except 50 Hz mains."
    source: "calibration/info.xlsx A2:H2 (all position cells '-'); spectral check: Welch PSD; 'tonal lines' = peaks >=10 dB above a 60 Hz running-median floor in 40 Hz-4 kHz; 60-400 Hz band level (mains bins excluded) averaged over the 8 channels; burst on/offset + flatness measured on ch0"
    confidence: "medium"
