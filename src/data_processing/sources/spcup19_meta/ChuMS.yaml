    flight_mode: hover
    contains_rotor_noise: true
    n_active_rotors: 4
    external_source: none
    throttle_or_speed: "altitude hold at ~2.5 m (report); speed not reported, measured shaft ~100 Hz, BPF ~199 Hz (2 blades)"
    channels_used: [0, 1, 2, 3, 4, 5, 6, 7]
    recorder_align: {group_a: [0, 1, 3, 4], group_b: [2, 5, 6, 7], k_samples: 28145}  # B[n+K] ~ A[n], GCC-PHAT mic 3 vs mic 2
    description: >-
      Test 1: hover with 1 propeller (2 blades) per rotor, repeat 1. Calibrated Pa, 44.1
      kHz, per-mic lengths 3219301-3307501 samples. Inter-recorder offset K = +28145 samples
      (B[n+K] ~ A[n]; K>0 -> drop the first K samples of channels 2,5,6,7; K<0 -> drop the
      first |K| samples of channels 0,1,3,4).
    source: "report p.2 Sec. 3.2 + Table 3 (Test 1 = 1 propeller), Sec. 4.1 (truncated to hover); Details '1 propellers. Repeat:1'; Welch PSD of Data(8); GCC-PHAT mic3 vs mic2 (0-40 s and 20-50 s windows agree)"
