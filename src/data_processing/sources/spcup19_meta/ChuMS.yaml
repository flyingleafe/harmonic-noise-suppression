open_questions:
  - "The current builder tags ChuMS as a static 'propeller_rig' / 'fixed_array_bench'. The report contradicts this: a flying UAV under altitude hold at ~2.5 m with only pilot drift correction, and the audio truncated to hover (Sec. 3.2, 4.1). 'N propellers' means N two-blade P15x5 propellers stacked per motor (2/4/6 blades), with all 4 rotors running. Spectra agree: the blade-passing frequency equals 2N x the shaft rate, and the shaft rate falls as blades are added (~97 -> ~83 -> ~76 Hz), which is what constant-thrust hover predicts. A quad could not hover on 1-3 rotors."
  - "The builder labels MicPositions as 'xy'; the second column is z (height relative to the propeller plane), and y = 0 for every mic."
  - "INTER-RECORDER MISALIGNMENT (affects any multichannel use): mics 1,2,4,5 (channels 0,1,3,4) and mics 3,6,7,8 (channels 2,5,6,7) come from two unsynchronised Zoom H6 recorders and were truncated independently. The builder start-aligns all 8 mics, so the two groups are offset by K samples per test (B[n+K] ~ A[n]): T1 +28145, T2 +52510, T3 +18511, T4 -41700, T5 -84390, T6 -315058, T7 +71326, T8 -37792, T9 -101863 (+-1 sample; K is from GCC-PHAT mic 3 vs mic 2, which sit 0.13 m apart on the mast with <1 sample expected acoustic lag; mics 1, 4 and 5 give the same K within ~2 samples, except mic 5 in T3 at 18487). K was identical in the 0-40 s and 20-50 s windows, and Test 1 re-checked at 10 s and 53 s drifted by only 3 samples. The report does not mention this."
  - "Report Table 2 rotor rows are self-contradictory (C = A, D = B). rotor_pos keeps the table's y column and re-orders the x column to match Fig. 2 (boom between A and B; A-D and B-C diagonal). The sign of y for A vs B additionally relies on reading Fig. 2's perspective as viewed from above."
  - "Fig. 2's drawn axis labels (boom arrow labelled 'y') disagree with Table 2 / MicPositions (boom = x); Table 2 is followed."
  - "Rotor speed/throttle is not reported; shaft/BPF values are measured from Data(8) PSD peaks and are approximate. The four rotors run at slightly different speeds under flight control."
  - "Outdoor park recording: low-level traffic/ambient noise and ~5 km/h wind are acknowledged (Sec. 3.1) but are incidental, not deliberate sources."
