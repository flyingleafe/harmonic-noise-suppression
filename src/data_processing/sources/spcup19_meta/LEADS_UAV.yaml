team: LEADS_UAV
report: "SPCUP19_LEADS_UAV_documentation.pdf"
supplementary:
  - "LEADS_UAV/datasets.docx (Table I: elevation/azimuth per file; read from word/document.xml)"
  - "LEADS_UAV/plot_structure.m (drone + microphone geometry)"
  - "LEADS_UAV/LEADS_UAV_pictures/LEADS_UAV_pic1.jpg .. pic4.jpg (pic1 = drone with mic boom hovering, pic2 = lawn site, pic3 = pic4 byte-identical = speaker standing under hovering drone)"
  - "dataset page /tmp/spcup_page.txt (Team LEADS_UAV entry)"
  - "LEADS_UAV/data/*.wav (spectral checks)"
summary: >-
  Southeast University recorded a hovering DJI Phantom 3 Advanced quadrotor outdoors on an
  open lawn with one microphone mounted on a rod 0.12 m below the bottom of the landing
  bracket (44.1 kHz, single channel). Ten ~10 s recordings (1.wav-10.wav) contain a team
  member speaking from a fixed position on the ground at the elevation/azimuth listed in
  datasets.docx; motor_recording.wav is a 10 s ego-noise-only recording in hover without
  the source.
drone:
  make_model: "DJI Phantom 3 Advanced"
  n_rotors: 4
  source: "report §2 p.1 ('A quadrotor UAV Phantom 3 Advanced ... equipped with four 2312A motors'); dataset page"
frame:
  description: >-
    plot_structure.m frame: origin = centroid of the box formed by the landing bracket
    (vertices +-0.0775, +-0.075, +-0.0525 m), x = drone forward, z = up; metres. The report
    calls it a left-hand system (y to the right, azimuth positive clockwise seen from above);
    the positions below are symmetric under y -> -y, so they are equally valid in the
    right-handed (y = left) convention used by DREGON.
  source: "report §2 p.1 (coordinate-system paragraph) + Fig. 2 p.2; plot_structure.m (vertex_array, micPos, drone_core, rotorsPos)"
geometry:
  phantom3_mono:
    mic_pos: [[0.0, 0.0, -0.1725]]
    mic_pos_quality: reported
    channel_map_source: "single-channel recordings; the only microphone is channel 0 (plot_structure.m labels it '0')"
    rotor_pos:
      - [-0.1237, 0.1237, 0.1405]
      - [-0.1237, -0.1237, 0.1405]
      - [0.1237, -0.1237, 0.1405]
      - [0.1237, 0.1237, 0.1405]
    rotor_pos_quality: reported
    source: >-
      plot_structure.m: micPos = [0 0 -0.1725]; rotorsPos(i) = [r cosd(a+90), r sind(a+90),
      drone_core(end,3)] + offset with r = 0.350/2, a = 45:90:359, offset = (0, 0, 0),
      drone_core(end,3) = 0.1405 -> rows above (rotor numbering 1-4 as in the .m and Fig. 2).
      Consistent with report §2: mic 0.12 m below the bottom of the drone (bracket bottom
      z = -0.0525), symmetric rotor wheelbase 0.35 m.
    notes: >-
      Rotors are placed at the top face of the modelled 'drone core' box, which is the
      team's approximation of the propeller plane. The mic sits on a rigid rod (pic1), on
      the vertical axis through the body centre.
recordings:
  - key: LEADS_UAV__data__1
    raw: "LEADS_UAV/data/1.wav"
    geometry: phantom3_mono
    condition: flight
    flight_mode: hover
    contains_rotor_noise: true
    n_active_rotors: 4
    external_source: speech
    throttle_or_speed: "hover; report: propeller rate at hover up to 130 turns/s"
    channels_used: [0]
    description: >-
      Outdoor (open lawn), drone hovering under program control; a team member standing
      still on the ground speaks ('variant speech') as a single static source. Source
      direction relative to the drone: elevation -17 deg, azimuth 82 deg (azimuth measured
      clockwise from the drone x/forward axis seen from above; elevation positive when the
      source is above the drone). ~10 s, 44.1 kHz.
    source: >-
      report §4 p.2 and Fig. 4; datasets.docx Table I row '1.wav' (Elevation -17 deg,
      Azimuth(Overlooking clockwise) 82 deg); azimuth/elevation definition report §2 p.1;
      verified: median-whitened spectrogram (200-3500 Hz) shows transient formant/pitch events over the stationary rotor harmonics, absent in motor_recording.wav
    confidence: high
