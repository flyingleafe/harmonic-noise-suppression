open_questions:
  - "Report says a left-hand coordinate system (x forward, z up); plot_structure.m draws it with MATLAB's right-handed axes. Because the mic is on the z axis and the rotors are placed symmetrically, the position sets are unchanged; only the individual rotor labels 1-4 swap between left and right."
  - "Rotor z (0.1405 m) is the top of the team's schematic 'drone core' box, not a measured hub height."
  - "Source distance/height is not given (only elevation/azimuth in datasets.docx); the hover height was read from the DJI app but not reported."
  - "Speech content/talker identity and SNR are not documented; 'variant speech' only."
