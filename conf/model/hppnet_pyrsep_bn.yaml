# hppnet_pyrsep_bn — hppnet_pyrsep_in.yaml with BATCH norm (HarmoF0's) after
# every convolution block instead of instance norm. The only difference in the
# pair. Instance norm normalises each clip's feature plane to zero mean / unit
# variance per channel, so an all-stopped clip and a cruise clip look alike to
# everything after block_1 and the 0 rev/s bin can only be a contrast default;
# batch norm keeps absolute level (dataset statistics, affine), which is what
# HarmoF0's off path reads (real_zero 0.5 vs HPPNet-L1's 9.5, 2026-10-15).
# Expected: much better real_zero at equal cruise.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_pyramid
  sr: 16000
  hop_length: 512
  num_rotors: 4
  n_ffts: [16384, 8192, 4096, 2048]
  level0_fmax: 1200.0
  out_bins: 164
  k_max: 84
  k_sub: 8
  f_min: null
  f_max: null
  c_har: 16
  embedding: 128
  norm: batch
  rate_taps: false
  n_maps: 4
  head: sepconv
  lstm_size: 128
  max_slew: 15.0
model_type: null
legacy_config_path: null
