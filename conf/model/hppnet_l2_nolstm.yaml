# L2 without its FreqGroupLSTM: conf/model/hppnet_l2.yaml with `head: conv1x1`,
# i.e. the published CQT front end, HarmonicDilatedConv, CNNTrunk (block_6-8
# are the only temporal model) and a 1x1 to the four maps, then the
# FreqSuperResHead onto the 0-150 rev/s / 300-bin linear grid. The CQT-side
# counterpart of hppnet_pyramid (variant C): what the per-bin LSTM was worth.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  superres_out: true
  out_fmin: 0.0
  out_fmax: 150.0
  out_bins: 300
  head_hidden: 32
  head_kernel: 5
  head: conv1x1
model_type: null
legacy_config_path: null
