# hppnet_l2_r2legacy — FROZEN build of `hppnet_l2_r2_s0` (the frozen-real-split
# reference, 2.27; docs/experiments/paper-regime-matrix.md review B) and of the
# `real_r4_hppnet_l2*_unified` arms, and of `rig_easy_hppnet_l2_unified` with every
# arm inheriting it (`nv2_*`, `nv3r4_*`, `prior_v1` HPPNet-L2): the published HPPNet trunk + FreqGroupLSTM,
# four per-rotor maps, resampled onto a linear 0-150 rev/s grid of 300 bins by
# the RETIRED `FreqSuperResHead` (clamped sub-27.5 bins, 2 x Conv(5,1)+BN+ReLU
# mixing the maps, 1x1; models.harmonic_ports.hppnet_superres_legacy). Kept so
# those checkpoints build and re-score on the rp_real panel
# (scripts/rp_panel_eval.py); the protocol's L2 is hppnet_l2.yaml.
# Loss/metrics: conf/{loss,metrics}/salience_layers_r150.yaml (300 bins).
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig_superres_legacy
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  out_fmin: 0.0
  out_fmax: 150.0
  out_bins: 300
  head_hidden: 32
  head_kernel: 5
model_type: null
legacy_config_path: null
