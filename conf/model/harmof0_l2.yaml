# harmof0_l2 — level L2 of the adaptation ladder (docs/experiments/
# paper-real-protocol.md): conf/model/harmof0_l1.yaml + the minimal translation
# head (models.salience_rps.TranslationHead) onto the 164-bin 0-159.2 rev/s
# grid (models.salience_crf.RP_LINEAR_GRID). conf/model/hppnet_l2.yaml carries
# the head's definition; the two share it exactly.
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_rp.yaml.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: harmof0_orig
  n_fft: 1024
  hop_length: 512
  num_rotors: 4
  sr: 16000
  n_freq: 512
  fmin: 27.5
  bins_per_octave: 48
  freq_bins: 352
  n_har: 12
  channels: [32, 64, 128, 128]
  dilation_rates: [48, 48, 48, 48]
  published_interp: true
  n_maps: 4
  translation_head: true
model_type: null
legacy_config_path: null
