# FROZEN build of `real_r4_hppnet_l2convlstm_unified` (2026-10-08): HPPNet-L2 on
# the CQT with its FreqGroupLSTM replaced by a DENSE RateConvLSTM (gates along
# the 48/octave log axis, half-width 15) and the RETIRED FreqSuperResHead onto
# the 300-bin 0-150 rev/s grid — conf/model/hppnet_l2_convlstm.yaml as it was at
# f2539b52, before the cutover moved that file to the translation head and the
# separable recurrence. Only for re-scoring the old checkpoint on the rp_real
# panel (scripts/rp_panel_eval.py); nothing new trains with it.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig_superres_legacy
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  out_fmin: 0.0
  out_fmax: 150.0
  out_bins: 300
  head_hidden: 32
  head_kernel: 5
  head: convlstm
  convlstm_half_width: 15
  separable: false
model_type: null
legacy_config_path: null
