# hppnet_pyrseplstm_dil128 — hppnet_pyrseplstm_dil71.yaml with 128 fixed
# offsets (Δo = (7992.2 - 159.2) / 128 ≈ 61 Hz) instead of 71: asks whether a
# denser plain dilated convolution can stand in for HRSPNet's harmonic gather
# (Dmitrii, 2026-11-14). 262 272 weights in the tap layer against 145 536.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_pyramid
  sr: 16000
  hop_length: 512
  num_rotors: 4
  n_ffts: [16384, 8192, 4096, 2048]
  level0_fmax: 1200.0
  out_bins: 164
  taps: dilated
  n_taps: 128
  f_min: null
  f_max: null
  c_har: 16
  embedding: 128
  norm: instance
  rate_taps: false
  n_maps: 4
  head: convlstm
  lstm_size: 128
  max_slew: 15.0
  separable: true
model_type: null
legacy_config_path: null
