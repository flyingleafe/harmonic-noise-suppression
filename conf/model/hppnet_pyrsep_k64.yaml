# hppnet_pyrsep_k64 — HRSPNet (hppnet_pyrseplstm_k64.yaml) without its
# recurrence: the separable RateConvLSTM head replaced by the same-frame
# separable rate kernel (`head: sepconv`: the ConvLSTM's 33-tap per-channel
# kernel on the CURRENT frame + 1x1 mix + ReLU), exactly the change of the pair
# hppnet_pyrsep_in.yaml -> hppnet_pyrseplstm.yaml at k <= 84. Everything else
# (pyramid, k <= 64 + sub-harmonics 1/2..1/8, no block_4 / block_5, instance
# norm, 164-bin grid) is HRSPNet's. Time context: block_6..8 and the CRF.
# Side ablation of the paper's chain table under hard pretraining
# (docs/experiments/rp-synthetic.md, 2026-11-14).
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_pyramid
  sr: 16000
  hop_length: 512
  num_rotors: 4
  n_ffts: [16384, 8192, 4096, 2048]
  level0_fmax: 1200.0
  out_bins: 164
  k_max: 64
  k_sub: 8
  f_min: null
  f_max: null
  c_har: 16
  embedding: 128
  norm: instance
  rate_taps: false
  n_maps: 4
  head: sepconv
  lstm_size: 128
  max_slew: 15.0
model_type: null
legacy_config_path: null
