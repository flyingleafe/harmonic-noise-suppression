# cMPDR + ULCNet (Bologni, Arrieta Larraza, Heusdens, Hendriks, EUSIPCO 2026,
# arXiv:2602.12986; ULCNet: Shetu et al., ICASSP 2024, arXiv:2312.08132, as
# re-implemented in Keras by the cMPDR_DNN authors). See src/models/cmpdr/.
# Upstream: github.com/narrietal/cMPDR_DNN @753c04cbe986 (networks, MIT)
# + github.com/Screeen/cmvdr @fe4386cda30b (cMPDR filter, MIT).
# Stage 1: blind cMPDR, same settings as cmpdr_crn.yaml (no parameters).
# Stage 2, ULCNet: 685,147 parameters (verified against the Keras model;
# paper Table I: 0.68M). Power-law compression 0.3, 8 bands of 48 bins,
# CRM mode 'E'. STFT: 512 window (sqrt Hann / 2, WOLA), 128 hop, 512-pt FFT.
# Upstream outputs the complex spectrogram; this port adds the WOLA iSTFT.
task: speech_enhancement
task_params:
  n_channels: null
  use_rps: false
  predict_rps: false
  sr:
  - 16000
  - 1
_target_: models.cmpdr.build_cmpdr
params:
  network: ulcnet
  use_cmpdr: true
  frontend:
    sr: 16000
    nfft: 2048
    overlap_fraction: 0.75
    forgetting_factor: 0.05
    condition_number: 1000.0
    p_max: 8
    harmonic_threshold: 0.6
    freq_range_cyclic: [20.0, 2500.0]
    peaks_nfft: 131072
    peaks_max_len_seconds: 2.0
    peaks_wait_len_seconds: 0.05
    peaks_min_dist_hz: 20.0
    peaks_max_ratio_from_highest: 10000.0
    peaks_min_width: 1.0
    max_num_peaks: 10
    coherence_min_relative_power: 1000.0
    alpha_rel_tol: 1.0e-3
    dtype: float64
  network_params:
    block_len: 512
    block_shift: 128
    bidirectional_frnn_units: 64
    sub_band_rnn_units: 128
    compression_factor: 0.3
    crm_eps: 1.0e-8
