# hppnet_l2k64_convlstm — "+ ConvLSTM" of the paper's HPPNet-L2 -> HRSPNet chain
# (Table "From HPPNet-L2 to HRSPNet"): conf/model/hppnet_l2k64.yaml with
# FreqGroupLSTM replaced by the SEPARABLE RateConvLSTM, exactly as
# hppnet_l2k84_convlstm.yaml does for k <= 84 (hidden 64 per direction,
# bidirectional, per-channel tap kernel + 1x1 mix; convlstm_half_width 15 log
# bins, the data-sized reach of hppnet_l2_convlstm.yaml). Next link: the STFT
# pyramid with HPDC, hppnet_pyrseplstm_k64.yaml (HRSPNet).
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_rp.yaml.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 385
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  harmonic_k_max: 64
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  translation_head: true
  head: convlstm
  convlstm_half_width: 15
  separable: true
model_type: null
legacy_config_path: null
