# hppnet_l1 — level L1 of the adaptation ladder (docs/experiments/
# paper-real-protocol.md): conf/model/hppnet_l0.yaml with FOUR per-rotor maps
# on HPPNet's own log grid. The last layer (FreqGroupLSTM's Linear) emits 4
# maps instead of 1, and a per-map OFF logit (models.salience_rps.OffLogitHead:
# Linear(128 -> 4) on the trunk features pooled over frequency) is prepended as
# bin 0 — the log grid has no zero rate and a stopped rotor needs a state.
# Output (B, 4 * 353, T): per map [off, 27.5 * 2**(b/48) for b < 352]. Readout:
# one CRF path per map (models.harmonic_ports.layer_readout), off state free to
# enter and leave, sub-bin parabola in rev/s. Nothing else changes from L0.
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_log48.yaml (the same
# log_off grid). L0 -> L1 isolates the per-rotor encoding; L1 -> L2
# (hppnet_l2.yaml) the target grid.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  translation_head: false
model_type: null
legacy_config_path: null
