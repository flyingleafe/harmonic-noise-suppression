# L1: original hppnet front end/harmonic blocks/FreqGroupLSTM, ONE shared map,
# FreqSuperResHead onto the LateDeep L1 output grid (linear 20–130 rev/s, 720
# bins = 0.153 rev/s per bin). The finer output grid only: threshold + Hungarian
# decode as at L0, no per-rotor layers, no CRF (those are L2, hppnet_l2.yaml).
# Below the native fmin=27.5 Hz the interpolation clamps; it adds no new
# acoustic evidence. Ladder: docs/experiments/paper-regime-matrix.md § "Block S".
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 1
  superres_out: true
  out_fmin: 20.0
  out_fmax: 130.0
  out_bins: 720
  head_hidden: 32
  head_kernel: 5
model_type: null
legacy_config_path: null
