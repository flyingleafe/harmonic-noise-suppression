# hppnet_l2 — level L2 of the adaptation ladder (docs/experiments/
# paper-real-protocol.md): conf/model/hppnet_l1.yaml + the minimal translation
# head (models.salience_rps.TranslationHead) onto the protocol's linear grid,
# 0-159.2 rev/s in 164 bins (models.salience_crf.RP_LINEAR_GRID, bin 0 = the
# 0 rev/s rate bin):
#   1. fixed W (0 parameters): per output bin the mean of the log bins inside
#      ±half a bin where the log grid is finer (below ~67 rev/s), linear
#      interpolation where coarser; the L1 off logit routed to bin 0, trained
#      there as the 0 rev/s rate; output bins
#      whose window holds no log bin (1-26 rev/s, below the CQT's 27.5) are a
#      fixed logit -10 — not representable by L0-L2;
#   2. ONE depthwise linear Conv2d(4, 4, (9, 1), groups=4), identity-initialised,
#      no normalisation, no activation (40 parameters).
# The head adds no resolution the trunk's grid lacks; the first link of the
# HPPNet -> HRSPNet chain (+k84: hppnet_l2k84.yaml).
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_rp.yaml.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  translation_head: true
model_type: null
legacy_config_path: null
