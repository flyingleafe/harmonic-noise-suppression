# harmof0_l1 — level L1 of the adaptation ladder (docs/experiments/
# paper-real-protocol.md): conf/model/harmof0_l0.yaml with FOUR per-rotor maps
# on HarmoF0's own log grid. conv_6 emits 4 maps instead of 1, and a per-map
# OFF logit (models.salience_rps.OffLogitHead: Linear(64 -> 4) on
# relu(conv_5) pooled over frequency) is prepended as bin 0. Output
# (B, 4 * 353, T): per map [off, 27.5 * 2**(b/48) for b < 352]. Readout: one
# CRF path per map with a free off state. Nothing else changes from L0.
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_log48.yaml (shared with
# hppnet_l1 — the two log grids are bit-identical).
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: harmof0_orig
  n_fft: 1024
  hop_length: 512
  num_rotors: 4
  sr: 16000
  n_freq: 512
  fmin: 27.5
  bins_per_octave: 48
  freq_bins: 352
  n_har: 12
  channels: [32, 64, 128, 128]
  dilation_rates: [48, 48, 48, 48]
  published_interp: true
  n_maps: 4
  translation_head: false
model_type: null
legacy_config_path: null
