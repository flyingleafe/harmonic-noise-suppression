# L2 without its FreqGroupLSTM, with the harmonic organ extended to k = 84:
# conf/model/hppnet_l2_nolstm.yaml with n_bins 385 and harmonic_k_max 84.
#
# WHY. The published grid (fmin 27.5, 352 bins at 48/octave) tops out at
# 4.37 kHz and HarmonicDilatedConv reads k = 2..9, so neither the input nor
# the harmonic layer ever saw DREGON's strong comb around 6 kHz (harmonics
# ~40-80). n_bins 385 extends the CQT to 7.04 kHz (the top filter must stay
# under Nyquist); harmonic_k_max 84 appends branches at round(48 log2 k) for
# k = 10..84 (offsets 159..307 bins) to the SAME operator — the published
# eight branches are the first eight, unchanged, so earlier L2 results stand.
# The counterpart of hppnet_pyramid_k84: same k set, same k_sub, same ceiling
# (7.0 vs 7.5 kHz), the only difference the axis.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 385
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  harmonic_k_max: 84
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  superres_out: true
  out_fmin: 0.0
  out_fmax: 150.0
  out_bins: 300
  head_hidden: 32
  head_kernel: 5
  head: conv1x1
model_type: null
legacy_config_path: null
