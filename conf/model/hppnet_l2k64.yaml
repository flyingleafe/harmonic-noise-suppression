# hppnet_l2k64 — "+ harmonics k <= 64" of the paper's HPPNet-L2 -> HRSPNet chain
# (Table "From HPPNet-L2 to HRSPNet"; docs/experiments/paper-real-protocol.md
# § "Paper grid after the experiments rewrite"): conf/model/hppnet_l2k84.yaml
# with harmonic_k_max 64, the range of HRSPNet (hppnet_pyrseplstm_k64.yaml).
# The CQT keeps 385 bins (to 7.04 kHz), so only the harmonic set differs from
# the k <= 84 link; FreqGroupLSTM, the L1 off logit (routed to bin 0 as the
# 0 rev/s rate) and the TranslationHead unchanged. Next link:
# hppnet_l2k64_convlstm.yaml.
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_rp.yaml.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 385
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  harmonic_k_max: 64
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  translation_head: true
model_type: null
legacy_config_path: null
