# hppnet_pyrseplstm — candidate final form of HRSPNet (Dmitrii, 2026-10-16):
# hppnet_pyrsep_in.yaml with the separable RateConvLSTM head in place of the
# same-frame separable rate kernel. Everything else is hppnet_pyrsep_in's:
# the pyramid (16384/8192/4096/2048), k <= 84 + sub-harmonics 1/2..1/8, no tap
# ceiling, no block_4 / block_5, INSTANCE norm (the batch-norm twin lost:
# rp_pyrsep_bn_all 3.17 vs rp_pyrsep_in_all 2.59), 164-bin grid.
#
# The pair hppnet_pyrsep_in -> hppnet_pyrseplstm is the recurrence-only
# ablation: both heads have the 33-tap rate kernel (half-width
# ceil(15 / 0.9765625) = 16); the ConvLSTM applies it to the previous frame's
# hidden state in both directions (hidden 64 + 64), sepconv to the current
# frame's features. The old dense ConvLSTM checkpoint (k <= 32, block_4/5,
# 1.6 M) scored 2.57 on the rp_real panel with ramp 5.71 vs sepconv's 9.93 —
# recurrence is worth ~4 rev/s on ramps and ~0.2 on the macro, if it
# transfers to this form (docs/experiments/paper-real-protocol.md).
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_pyramid
  sr: 16000
  hop_length: 512
  num_rotors: 4
  n_ffts: [16384, 8192, 4096, 2048]
  level0_fmax: 1200.0
  out_bins: 164
  k_max: 84
  k_sub: 8
  f_min: null
  f_max: null
  c_har: 16
  embedding: 128
  norm: instance
  rate_taps: false
  n_maps: 4
  head: convlstm
  lstm_size: 128
  max_slew: 15.0
  separable: true
model_type: null
legacy_config_path: null
