# FlowSE (Lee, Cheong, Han, Shin, "FlowSE: Flow Matching-based Speech
# Enhancement", ICASSP 2025, doi:10.1109/ICASSP49660.2025.10888274,
# arXiv:2508.06840) -- conditional flow matching in the compressed complex STFT
# domain, native 16 kHz. NOT the mel + vocoder FlowSE of Wang et al.
# Upstream: https://github.com/seongq/flowmse @ f6b479d1 (no licence: the flow
# path / loss / sampler are re-implemented from the paper; the NCSN++ backbone
# is models.sgmse.ncsnpp, from sp-uhh/sgmse, MIT). See src/models/flowse/model.py.
# Parameters: 65,590,822 measured (65,590,694 trainable + 128 frozen Fourier
# time-projection weights; NCSN++ as in BBED/CRP/SGMSE+, which quote 65.6M;
# the FlowSE paper prints no count). The EMA copy is held as buffers and
# doubles the state_dict size.
# STFT: n_fft 510, hop 128, periodic Hann, centred (256 bins); compression
# 0.15 * |X|^0.5 * exp(i angle X); frames padded to a multiple of 64.
# forward(mix, target) -> scalar CFM loss; forward(mix) -> Euler ODE sampler,
# N = num_steps = 5 network evaluations (paper Table I) -> (B, 1, T).
task: speech_enhancement
task_params:
  n_channels: null
  use_rps: false
  predict_rps: false
  sr:
  - 16000
  - 1
_target_: models.flowse.build_flowse
params:
  sample_rate: 16000
  n_fft: 510
  hop_length: 128
  spec_factor: 0.15        # c in c * |X|^alpha
  spec_abs_exponent: 0.5   # alpha
  sigma: 0.487             # std of the prior N(y, sigma^2 I); Eq. (21)
  t_eps: 0.03              # t_delta
  t_rev: 1.0               # sampler start, network time tau = 1 - t
  num_steps: 5             # Euler steps = NFE
  ema_decay: 0.999
  backbone:                # NCSN++ (sgmse defaults = BBED/CRP configuration)
    nf: 128
    ch_mult: [1, 1, 2, 2, 2, 2, 2]
    num_res_blocks: 2
    attn_resolutions: [16]
    nonlinearity: swish
    resamp_with_conv: true
    conditional: true
    fir: true
    fir_kernel: [1, 3, 3, 1]
    skip_rescale: true
    resblock_type: biggan
    progressive: output_skip
    progressive_input: input_skip
    progressive_combine: sum
    init_scale: 0.0
    fourier_scale: 16
    image_size: 256
    embedding_type: fourier
    dropout: 0.0
    centered: true
