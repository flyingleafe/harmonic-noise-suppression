# L2 with its FreqGroupLSTM replaced by RateConvLSTM: conf/model/hppnet_l2.yaml
# with `head: convlstm` — a bidirectional ConvLSTM over time whose gates are
# 1-D convolutions along the CQT's log axis (48 bins/octave), lstm_size 128
# split 64 + 64 over the directions, then a 1x1 to the four maps, the off
# logit and the TranslationHead onto the 164-bin 0-159.2 rev/s grid. The
# CQT-side counterpart of hppnet_pyramid_convlstm (variant A).
#
# SEPARABLE (the protocol's chain, docs/experiments/paper-real-protocol.md
# decision (b)): the recurrence is a per-channel 31-tap displacement kernel
# plus a 1x1 mix instead of a dense Conv1d(64 -> 256, k=31) per direction, so
# "+ConvLSTM" adds the mechanism (state moves along the rate axis) without a
# x3 parameter step.
#
# THE KERNEL. convlstm_half_width 15 CQT bins = the largest SUSTAINED (5-frame
# mean) per-frame slew in the raw telemetry of the training pools, measured
# in log bins at rates >= 27.5 rev/s (the CQT floor): `updown` 14.9, FLY125
# 5.8, `rectangle` 4.4, the rest ~3. Kernel 31: the state at bin g is written
# from g ± 15 of the previous frame.
#
# Loss/metrics: conf/{loss,metrics}/salience_layers_rp.yaml.
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 512]
_target_: models.registry.build_model
params:
  name: hppnet_orig
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  sr: 16000
  fmin: 27.5
  n_bins: 352
  bins_per_octave: 48
  c_har: 16
  embedding: 128
  lstm_size: 128
  dilations: [48, 12]
  freq_pool: 1
  time_pooling: false
  n_maps: 4
  translation_head: true
  head: convlstm
  convlstm_half_width: 15
  separable: true
model_type: null
legacy_config_path: null
