# Paper real-data protocol panel (docs/experiments/paper-real-protocol.md
# § "Validation panel"): 52 clips x 8 channels of rp-real-valid-v1, flattened
# to 416 mono items. Views are predicates over each item's meta (`where`)
# and, for the regime cells, one frame regime of metrics.regimes (ramp |
# zero | standby | cruise, from the TARGET). Score = frame-weighted mean of
# the per-frame PIT error (one rotor assignment per clip); the history also
# carries clip-level mean / std / count per view.
enabled: true
every_optimizer_steps: 500
max_optimizer_steps: 100000  # 200 rounds; the root `epochs: 200` is the round cap
batch_size: 32  # loader knob, no_grad: 8 s panel clips are 4x the 2 s training chunk, so 32 = the training activation footprint (128 OOMed HPPNet at 43 GiB on an A100-80)
num_workers: null
smoothing_window: 5
min_relative_improvement: 0.01
min_rounds: 50  # 25k steps, a quarter of the budget
final_patience: 30  # 15k stale rounds of the controls' medians; both conditions in parallel
control: [real_macro]  # the run stops once NONE of these improves (training/stopping.py)

datasets:
  real:
    _target_: data_processing.frame_datasets.DregonLMFrameDataset
    params:
      data_dir: dload:rp-real-valid-v1
      n_fft: 2048
      hop_length: 512
      sample_rate: 16000
      flatten_channels: true
    iterable: false

views:
  dregon: {where: {dataset: dregon}}
  md2: {where: {dataset: md2}}
  dregon_nosource: {where: {dataset: dregon, source_type: nosource}}
  dregon_source: {where: {dataset: dregon, source_type: loudspeaker}}
  md2_nosource: {where: {dataset: md2, source_type: nosource}}
  md2_source: {where: {dataset: md2, source_type: mixed}}
  dregon_zero: {where: {dataset: dregon}, regime: zero}
  dregon_standby: {where: {dataset: dregon}, regime: standby}
  dregon_ramp: {where: {dataset: dregon}, regime: ramp}
  dregon_cruise: {where: {dataset: dregon}, regime: cruise}
  md2_zero: {where: {dataset: md2}, regime: zero}
  md2_standby: {where: {dataset: md2}, regime: standby}
  md2_ramp: {where: {dataset: md2}, regime: ramp}
  md2_cruise: {where: {dataset: md2}, regime: cruise}
  # pooled over both datasets, frame-weighted; the same `real*` names are the
  # contract for a synthetic panel added beside this one (rp_real_combdiv.yaml),
  # hence the explicit dataset predicate. The control `real_macro` (aggregate
  # below) is the macro mean of the two datasets.
  real: {where: {dataset: [dregon, md2]}}
  real_nosource: {where: {dataset: [dregon, md2], source_type: nosource}}
  real_source: {where: {dataset: [dregon, md2], source_type: [loudspeaker, mixed]}}
  real_zero: {where: {dataset: [dregon, md2]}, regime: zero}
  real_standby: {where: {dataset: [dregon, md2]}, regime: standby}
  real_ramp: {where: {dataset: [dregon, md2]}, regime: ramp}
  real_cruise: {where: {dataset: [dregon, md2]}, regime: cruise}

aggregates:
  real_macro: {dregon: 0.5, md2: 0.5}

primary:
  - dregon
  - md2
  - real_macro
  - dregon_nosource
  - dregon_source
  - md2_nosource
  - md2_source
  - dregon_zero
  - dregon_standby
  - dregon_ramp
  - dregon_cruise
  - md2_zero
  - md2_standby
  - md2_ramp
  - md2_cruise
  - real
  - real_nosource
  - real_source
  - real_zero
  - real_standby
  - real_ramp
  - real_cruise
