# Root Hydra config — see docs/refactor-unified-framework.md § "Hydra config
# architecture". `schema: root` (training.config.RootConfig, registered in the
# ConfigStore by training.config.register_configs) supplies every field's
# default/type; zoo.load drops it with `~schema` to compose legacy experiments.
# The four `???` groups below are mandatory — an experiment file
# (conf/experiment/*.yaml) or a `data=... model=... loss=... metrics=...` CLI
# override must set them.
defaults:
  - schema: root
  - data: ???
  - model: ???
  - validation: disabled
  - loss: ???
  - metrics: ???
  - optim: adamw_cosine
  - logging: wandb
  - artifacts: r2
  - lora: disabled
  - _self_
  - experiment: null

experiment_name: ???
seed: 0
validate_only: false
allow_dirty: false
resume: false
# Default `results`, i.e. inside the checkout. Override with RESULTS_ROOT to put
# runs somewhere stable: omnirun pins each job to a revision and gives that
# revision its own worktree, so a run dir under the checkout is NOT shared
# between jobs at different commits — which silently breaks `resume=true`
# chaining (the new segment finds no train_state.pt and restarts at epoch 0).
# Point RESULTS_ROOT at a path outside the worktree (e.g. the cluster scratch)
# and a chain resumes correctly no matter how the code moves underneath it.
results_root: ${oc.env:RESULTS_ROOT,results}
# Round cap: validation rounds when `validation.enabled` (rp protocol: 200 =
# max_optimizer_steps / every_optimizer_steps), epochs otherwise.
epochs: 200
batch_size: 16
num_workers: 4
grad_clip: 5.0
grad_accum_steps: 1
amp: true
samples_per_validation: null
checkpoint_every: 0
checkpoint: null
