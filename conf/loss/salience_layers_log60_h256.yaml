# Per-rotor layer BCE on LateDeep's L1 grid (conf/model/latedeep_l1.yaml): the
# published HCQT grid 32.7 * 2**(b/60) for b < 360 plus the OFF state at bin 0
# -> 361 bins per map, hop 256 (the HCQT's own). fmin must match the model
# config's (32.7). Read conf/loss/salience_layers_rp.yaml for the argument.
# focus `auto` = 361 / 2.695 = 134.0.
terms:
  - name: bce
    _target_: losses.LayerPITSalienceBCELoss
    weight: 1.0
    params:
      grid: {kind: log_off, fmin: 32.7, bins_per_octave: 60, n_bins: 360}
      n_layers: 4
      sigma_rev_s: 1.0
      focus: auto
      rate: [16000, 256]
