# Per-rotor layer BCE on the LEGACY 307-bin pyramid grid: linear 0 ->
# 298.828125 rev/s (0.9765625 rev/s per bin = level 0's STFT bin width,
# 16000 / 16384). Serves only conf/model/hppnet_pyramid_convlstm_r4legacy.yaml
# (the historical real_r4_hppnet_pyrlstm_unified checkpoint); every protocol
# pyramid is on conf/loss/salience_layers_rp.yaml (164 bins). Everything that
# file argues holds; sigma_rev_s 0.9765625 = one bin, focus 122 = the value
# that run trained with (G / (sqrt(2 pi) sigma) = 307 / 2.507).
terms:
  - name: bce
    _target_: losses.LayerPITSalienceBCELoss
    weight: 1.0
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 298.828125, bins: 307}
      n_layers: 4
      sigma_rev_s: 0.9765625
      focus: 122.0
      rate: [16000, 512]
