# conf/loss/salience_layers_r150.yaml on the hppnet_pyramid grid: linear
# 0 -> 298.828125 rev/s in 307 bins (0.9765625 rev/s per bin = level 0's STFT
# bin width, 16000 / 16384). The model builds its grid with
# models.multif0.utils.linear_freq_grid from the same three numbers, so the
# target lands on the model's own bins. Everything that file argues (Gaussian
# per-rotor layers, no pos_weight, focus as the imbalance handle) holds here;
# focus = G / (sqrt(2 pi) sigma) = 307 / 2.507 = 122.
terms:
  - name: bce
    _target_: losses.LayerPITSalienceBCELoss
    weight: 1.0
    params:
      out_fmin: 0.0
      out_fmax: 298.828125
      out_bins: 307
      n_layers: 4
      sigma_bins: 1.0
      focus: 122.0
      rate: [16000, 512]
