# @package _global_
# SCv2 on the noise-model-v2 HARD bank: rigs interpolated along the
# CRUISE <-> CRUISE path between the two fitted v2 rigs (common order range
# K = 1..81, regime policy carried not blended), flown on trajectories drawn
# from the rig HYPERPRIOR (`posterior`) rather than from either evaluation rig.
# Neither the comb nor the flight envelope is privileged towards a rig the
# model is scored on.
#
# `rig_easy_scv2_unified` with ONE field changed, the training stream: same
# `real_r1_scv2` architecture, same `override /validation: rps_unified`,
# bfloat16, batch 128, 12 workers, 2 s clips, `samples_per_validation: null`,
# synthetic only. Paired with `nv2_easy_scv2`; the legacy stochastic-family
# pair read hard 5.37 against easy 5.72, and `real_r4_scv2_unified` is the
# real-data reference at val/real_r3 2.99.
#
# Stream: conf/online_mix/noise_v2_hard_5050.yaml. The bank is a gitignored
# build product; the job rebuilds it first
# (`python scripts/noise_v2_build_bank.py --preset hard`).
# Batch doc: docs/experiments/noise-v2-transfer.md.
defaults:
  - rig_easy_scv2_unified
  - _self_

experiment_name: nv2_hard_scv2
data:
  train:
    params:
      path: conf/online_mix/noise_v2_hard_5050.yaml
