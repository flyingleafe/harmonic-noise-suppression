# @package _global_
# CURRICULUM arm: `nv3r4_easy_scv2` (SCv2 on the round-4 v3 EASY bank,
# synthetic only) fine-tuned on REAL audio. Stage 2 of the pair; stage 1 has
# run and uploaded its `best_real_overall` checkpoint (selected round 36).
#
# `nv2_easy_ft_scv2` with ONE field changed, the warm start: parent
# `real_r4_scv2_unified` (the R4 real pool, `override /validation:
# rps_unified`, batch 128, 2 s clips), `patience: 20`, `lr: 1e-3`, fresh
# optimizer / scheduler / early-stopping state (`training.loop._warm_start`,
# `strict=False`). Read against nv2_easy_ft_scv2 (2.73), nv2_hard_ft_scv2
# (2.23) and real_r4_scv2_unified (3.11).
# Batch doc: docs/experiments/noise-model-v3.md § Round 4.
defaults:
  - real_r4_scv2_unified
  - _self_

experiment_name: nv3r4_easy_ft_scv2
checkpoint: best:real_overall@nv3r4_easy_scv2
patience: 20
optim:
  lr: 0.001
