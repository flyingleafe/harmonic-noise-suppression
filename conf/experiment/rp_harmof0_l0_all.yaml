# @package _global_
# Claim 1: unadapted HarmoF0 (L0) on the rp_all stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: harmof0_l0
  - override /loss: salience_bce_orig
  - override /metrics: salience_bce_orig
  - override /validation: rp_real
  - _self_

experiment_name: rp_harmof0_l0_all
batch_size: 128
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 1.0e-3  # LR range test rp_harmof0_l2_all: flat 1e-4..1e-2, rises from 1.6e-2
