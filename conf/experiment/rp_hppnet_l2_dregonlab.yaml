# @package _global_
# Claim 6: HPPNet at L2 on the rp_dregon_labelaug stream (one of two directions; only the better one runs). Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_l2
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real
  - _self_

experiment_name: rp_hppnet_l2_dregonlab
batch_size: 64  # x2 accumulation = effective 128: 128 OOMs at 32 GB (range test, 2026-10-15)
grad_accum_steps: 2
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_dregon_labelaug.yaml
optim:
  lr: 1.0e-3  # placeholder: set from results/rp_lr_range/hppnet.json (LR range test)
