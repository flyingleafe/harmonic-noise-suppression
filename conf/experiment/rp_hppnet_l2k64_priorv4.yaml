# @package _global_
# Paper chain table "+ harmonics k <= 64" (rp_hppnet_l2k64_all) in the HARD synthetic setup: real noise replaced by the wide prior of noise model v4, synthesized online (conf/online_mix/rp_priorv4.yaml), validated on the real panel, static_comb and the six synthetic sectors (conf/validation/rp_real_priorv4.yaml). Tests whether HRSPNet's STFT pyramid pays off on the test split under synthetic pretraining. Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_l2k64
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real_priorv4
  - _self_

experiment_name: rp_hppnet_l2k64_priorv4
batch_size: 64  # x2 accumulation = 128 as rp_hppnet_l2k64_all and rp_pyrseplstm_k64_priorv4
grad_accum_steps: 2
num_workers: 12  # as rp_pyrseplstm_k64_priorv4: the v4 renders cost 0.026 CPU-s per 2 s draw
data:
  train:
    params:
      path: conf/online_mix/rp_priorv4.yaml
optim:
  lr: 1.0e-3  # as rp_hppnet_l2k64_all and rp_pyrseplstm_k64_priorv4
