# @package _global_
# Regressor row: published SimpleConv (Quiet Drones 2026) on the rp_all stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: simple_conv
  - override /loss: pit_mse
  - override /metrics: rps
  - override /validation: rp_real
  - _self_

experiment_name: rp_simpleconv_all
batch_size: 128
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 1.0e-3  # LR range test rp_simpleconv_all: floor at 7.3e-3, rises from 7.8e-3
