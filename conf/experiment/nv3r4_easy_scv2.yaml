# @package _global_
# SCv2 on the noise-model-v3 ROUND-4 EASY bank: `nv3r3_easy_scv2` with the
# round-3b fits replaced by the round-4 fits (results/noise_v3/fits_r4:
# rig-only, no wander, round-4 priors, Michael's channels normalised by the
# measured array response); 1024 DREGON + 1024 Michael's neighbourhood draws
# at strength 3.0 with the speed exponents pinned to (6, 6), each flown on
# its own rig's fitted trajectory (conf/online_mix/noise_v3r4_easy_5050.yaml).
#
# `rig_easy_scv2_unified` with ONE field changed, the training stream, exactly
# as `nv2_easy_scv2`: same `real_r1_scv2` architecture, same
# `override /validation: rps_unified`, bfloat16, batch 128, 12 workers, 2 s
# clips, `samples_per_validation: null`, synthetic only. Read against
# `nv3r3_easy_scv2` (4.68), `nv2_easy_scv2` (7.94), the legacy easy arm (6.09)
# and `real_r4_scv2_unified` (2.99).
#
# Stream: conf/online_mix/noise_v3r4_easy_5050.yaml; the bank file is local
# until published (`noise-v3r4-banks`). Batch doc: docs/experiments/noise-model-v3.md.
defaults:
  - rig_easy_scv2_unified
  - _self_

experiment_name: nv3r4_easy_scv2
data:
  train:
    params:
      path: conf/online_mix/noise_v3r4_easy_5050.yaml
