# @package _global_
# Real-data FINE-TUNING of rp_scv2_priorv4 (paper grid, "tuned" row; Dmitrii, 2026-10-23): warm-started from its synthetic-selected checkpoint (best_uniform_median), trained on rp_all without label augmentation with a fresh AdamW, max LR 1e-4, 1 000 warm-up steps and a cosine over 20 000 steps; validated on the real panel. Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: hb_scv2_mag_nogate
  - override /loss: pit_mse
  - override /metrics: rps
  - override /validation: rp_real
  - _self_

experiment_name: rp_scv2_priorv4_ft
checkpoint: best:uniform@rp_scv2_priorv4
batch_size: 128
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 1.0e-4
  warmup_steps: 1000
validation:
  max_optimizer_steps: 20000  # 40 rounds: the cosine's length and the cap (min_rounds 50 never lets the saturation stop fire first)
