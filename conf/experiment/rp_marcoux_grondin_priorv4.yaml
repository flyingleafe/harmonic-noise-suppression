# @package _global_
# rp_marcoux_grondin_all with the real noise replaced by the WIDE PRIOR in noise model v4 (the paper grid's hard setup), synthesized online (conf/online_mix/rp_priorv4.yaml), validated on the real panel, static_comb and the six synthetic sectors (conf/validation/rp_real_priorv4.yaml). Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: marcoux_grondin_rps4
  - override /loss: marcoux_grondin_rps4
  - override /metrics: rps
  - override /validation: rp_real_priorv4
  - _self_

experiment_name: rp_marcoux_grondin_priorv4
batch_size: 128
grad_accum_steps: 1
num_workers: 12  # as rp_scv2_priorv4
data:
  train:
    params:
      path: conf/online_mix/rp_priorv4.yaml
optim:
  lr: 1.0e-3  # as rp_marcoux_grondin_all
