# @package _global_
# rp_harmof0_l2_priorv4 trained from scratch on the 50/50 mixture of its synthetic stream and the real rp_all_labelaug stream (conf/online_mix/rp_priorv4_mixlab.yaml), validated, stopped and selected as rp_harmof0_l2_priorv4 (conf/validation/rp_real_priorv4.yaml). Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: harmof0_l2
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real_priorv4
  - _self_

experiment_name: rp_harmof0_l2_priorv4_mixlab
batch_size: 128
grad_accum_steps: 1
num_workers: 12  # as rp_harmof0_l2_priorv4
data:
  train:
    params:
      path: conf/online_mix/rp_priorv4_mixlab.yaml
optim:
  lr: 1.0e-3  # as rp_harmof0_l2_all
