# @package _global_
# HRSPNet without its harmonic gather: 71 fixed taps r + j*Δo (Δo ≈ 110 Hz), a plain dilated convolution along linear frequency (conf/model/hppnet_pyrseplstm_dil71.yaml), in the HARD synthetic setup as rp_pyrseplstm_k64_priorv4: real noise replaced by the wide prior of noise model v4 (conf/online_mix/rp_priorv4.yaml), validated on the real panel, static_comb and the six synthetic sectors (conf/validation/rp_real_priorv4.yaml). Side ablation of the chain table. Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_pyrseplstm_dil71
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real_priorv4
  - _self_

experiment_name: rp_pyrseplstm_dil71_priorv4
batch_size: 128  # as rp_pyrseplstm_k64_priorv4: no accumulation, H100
grad_accum_steps: 1
num_workers: 12  # as rp_pyrseplstm_k64_priorv4: the v4 renders cost 0.026 CPU-s per 2 s draw
data:
  train:
    params:
      path: conf/online_mix/rp_priorv4.yaml
optim:
  lr: 1.0e-3  # as rp_pyrseplstm_k64_priorv4
