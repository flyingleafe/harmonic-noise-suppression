# @package _global_
# Claim 3 (head x stream square): pyramid + separable rate kernel, no block_4/5, instance norm, on the rp_all_labelaug stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_pyrsep_in
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real
  - _self_

experiment_name: rp_pyrsep_in_alllab
batch_size: 128  # no accumulation anywhere (Dmitrii, 2026-10-15); the pyramid peaks at 12 GB allocated (rp_pyrsep_in_all, W&B perf/), so a 32 GB uni card fits
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all_labelaug.yaml
optim:
  lr: 1.0e-3  # the max LR of published practice (HarmoF0, Cuesta 2020, Quiet Drones 2026: 1e-3; HPPNet 6e-4 at batch 4); range tests -> appendix
