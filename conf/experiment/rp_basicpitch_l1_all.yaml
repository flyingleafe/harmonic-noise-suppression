# @package _global_
# Claim 2: Basic Pitch at L1 (log_off layers, hop 256) on the rp_all stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: basicpitch_l1
  - override /loss: salience_layers_log36_h256
  - override /metrics: salience_layers_log36_h256
  - override /validation: rp_real
  - _self_

experiment_name: rp_basicpitch_l1_all
batch_size: 128
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 1.0e-3  # the max LR of published practice (HarmoF0, Cuesta 2020, Quiet Drones 2026: 1e-3; HPPNet 6e-4 at batch 4); range tests -> appendix
