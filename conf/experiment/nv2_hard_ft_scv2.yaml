# @package _global_
# CURRICULUM arm: `nv2_hard_scv2` (SCv2 on the v2 HARD bank — path rigs,
# hyperprior trajectories, synthetic only) fine-tuned on REAL audio. Stage 2
# of the pair; stage 1 must have run and uploaded its `best_real_overall`
# checkpoint.
#
# The real half is the family's REAL REFERENCE arm verbatim —
# `real_r4_scv2_unified`: the R4 real pool (`conf/online_mix/hb_m3s2_dload.yaml`),
# `override /validation: rps_unified`, batch 128, 2 s clips,
# `samples_per_validation: null`, val/real_r3 2.99. The pair
# `nv2_easy_ft_scv2` / `nv2_hard_ft_scv2` asks whether the WIDER pre-training
# distribution is the better initialisation, which is the transfer question
# the legacy pair could not answer because it never ran a curriculum arm.
#
# What this file adds to `real_r4_scv2_unified`: the warm start
# (`checkpoint: best:real_overall@nv2_hard_scv2`, resolved to
# `r2://<bucket>/<prefix>/nv2_hard_scv2/checkpoints/best_real_overall.ckpt`;
# loaded `strict=False` with a FRESH optimizer / scheduler / early-stopping
# state), renewed `patience: 20` and `lr: 1e-3`.
# Batch doc: docs/experiments/noise-v2-transfer.md.
defaults:
  - real_r4_scv2_unified
  - _self_

experiment_name: nv2_hard_ft_scv2
checkpoint: best:real_overall@nv2_hard_scv2
patience: 20
optim:
  lr: 0.001
