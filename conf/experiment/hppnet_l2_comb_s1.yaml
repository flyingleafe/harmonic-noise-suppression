# @package _global_
# B: hppnet L2, comb, seed 1.
# Matched protocol: docs/experiments/paper-regime-matrix.md (review experiments B/C).
# Both stages select on rps_mae; real fine-tuning uses this seed's comb checkpoint.
seed: 1
defaults:
  - override /data: sal_comb_synthval
  - override /model: hppnet_l2
  - override /loss: salience_layers_r150
  - override /metrics: salience_layers_r150

experiment_name: hppnet_l2_comb_s1
epochs: 200
patience: 20
batch_size: 16  # frames (= 2 chunks x 8 mics) — the salience rows' value
num_workers: 6
samples_per_validation: 16000
optim:
  monitor: rps_mae
  monitor_mode: min
