# @package _global_
# rp_pyrseplstm_k64_stochcomb fine-tuned on real data with the 5e-4 recipe of rp_pyrseplstm_k64_priorv4_ft_lr5e4, from the stochastic-comb-selected checkpoint. Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_pyrseplstm_k64
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real
  - _self_

experiment_name: rp_pyrseplstm_k64_stochcomb_ft_lr5e4
checkpoint: best:stoch_comb@rp_pyrseplstm_k64_stochcomb
batch_size: 128  # as rp_pyrseplstm_k64_priorv4_ft_lr5e4
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 5.0e-4
  warmup_steps: 1000
validation:
  max_optimizer_steps: 20000  # 40 rounds: the cosine's length and the cap (min_rounds 50 never lets the saturation stop fire first)
