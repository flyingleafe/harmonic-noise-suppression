# @package _global_
# rp_hppnet_l2k64_priorv4 fine-tuned on real data with the recipe of rp_pyrseplstm_k64_priorv4_ft_lr5e4 (rp_all stream, fresh AdamW at max LR 5e-4, 1000 warm-up steps, cosine to the 20 000-step cap). Seeds 1-2 run as experiment_name=<this>_s<n> seed=<n> with data.train.params.base_seed 20261015 / 20261016, paired with the HRSPNet seeds. Batch doc: docs/experiments/rp-synthetic.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_l2k64
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real
  - _self_

experiment_name: rp_hppnet_l2k64_priorv4_ft_lr5e4
checkpoint: best:uniform@rp_hppnet_l2k64_priorv4
batch_size: 64  # x2 accumulation = 128 as rp_pyrseplstm_k64_priorv4_ft_lr5e4
grad_accum_steps: 2
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 5.0e-4
  warmup_steps: 1000
validation:
  max_optimizer_steps: 20000  # 40 rounds: the cosine's length and the cap (min_rounds 50 never lets the saturation stop fire first)
