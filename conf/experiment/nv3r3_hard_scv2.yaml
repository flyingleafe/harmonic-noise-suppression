# @package _global_
# SCv2 on the noise-model-v3 round-3 HARD bank: `nv3_hard_scv2` with the
# round-2 v3 fits replaced by the round-3b fits (u_j kernel prior; static
# latent part folded into the rig, results/noise_v3/diag/folded_r3, commit
# b2c3f31b): rigs drawn along the CRUISE <-> CRUISE path between the two v3
# fits (common order range K = 1..81, regime policy carried not blended, the
# wander block carried as a policy), flown on trajectories from the rig
# HYPERPRIOR (`posterior`). The pair differs from nv3_* only in the anchor fits.
#
# `rig_easy_scv2_unified` with ONE field changed, the training stream, exactly
# as `nv2_hard_scv2`: same `real_r1_scv2` architecture, same
# `override /validation: rps_unified`, bfloat16, batch 128, 12 workers, 2 s
# clips, `samples_per_validation: null`, synthetic only. Read against
# `nv2_hard_scv2` (7.06) and `real_r4_scv2_unified` (2.99).
#
# Stream: conf/online_mix/noise_v3r3_hard_5050.yaml. The bank rides the pinned
# `noise-v3r3-banks` dataset; the job pulls it first (`dload pull
# noise-v3r3-banks`).
# Batch doc: docs/experiments/noise-model-v3.md.
defaults:
  - rig_easy_scv2_unified
  - _self_

experiment_name: nv3r3_hard_scv2
data:
  train:
    params:
      path: conf/online_mix/noise_v3r3_hard_5050.yaml
