# @package _global_
# hppnet_pyramid with the harmonic taps extended to k = 84 and the grid cut to
# 0-150 rev/s (conf/model/hppnet_pyramid_k84.yaml), no recurrence, real rung
# R4 under the unified regime — real_r4_hppnet_pyr_unified's recipe with the
# model and its loss/metrics twins swapped. Read against
# real_r4_hppnet_l2k84nolstm_unified (CQT to 7 kHz, same k set), the pair
# that isolates the front end with the high harmonics in play.
# Batch doc: docs/experiments/pyramid-harmonic.md.
defaults:
  - override /data: e12_real_fullflight
  - override /model: hppnet_pyramid_k84
  - override /loss: salience_layers_pyr154
  - override /metrics: salience_layers_pyr154
  - override /validation: rps_unified
  - _self_

experiment_name: real_r4_hppnet_pyrk84_unified
epochs: 200
patience: 20
batch_size: 64
grad_accum_steps: 2
num_workers: 6
samples_per_validation: null
data:
  train:
    params:
      path: conf/online_mix/hb_m3s2_dload.yaml
      duration_s: 2.0
validation:
  batch_size: 32
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: rps_mae
  monitor_mode: min
