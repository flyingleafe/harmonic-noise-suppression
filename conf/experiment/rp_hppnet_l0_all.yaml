# @package _global_
# Claim 1: unadapted HPPNet (L0) on the rp_all stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_l0
  - override /loss: salience_bce_orig
  - override /metrics: salience_bce_orig
  - override /validation: rp_real
  - _self_

experiment_name: rp_hppnet_l0_all
batch_size: 64  # x2 accumulation = effective 128: 128 OOMs at 32 GB (range test, 2026-10-15)
grad_accum_steps: 2
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 1.0e-3  # the max LR of published practice (HarmoF0, Cuesta 2020, Quiet Drones 2026: 1e-3; HPPNet 6e-4 at batch 4); range tests -> appendix
