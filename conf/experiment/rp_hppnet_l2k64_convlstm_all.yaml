# @package _global_
# Paper chain table (HPPNet-L2 -> HRSPNet), "+ ConvLSTM": rp_hppnet_l2k64_all with FreqGroupLSTM replaced by the separable RateConvLSTM of HRSPNet, on the rp_all stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_l2k64_convlstm
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real
  - _self_

experiment_name: rp_hppnet_l2k64_convlstm_all
batch_size: 64  # x2 accumulation = 128 as rp_hppnet_l2_all; fits any sae GPU (L40S 48 GB), as rp_hppnet_l2_alllab's uni resume
grad_accum_steps: 2
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 1.0e-3  # as rp_hppnet_l2_all
