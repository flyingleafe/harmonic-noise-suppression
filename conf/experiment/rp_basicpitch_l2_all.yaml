# @package _global_
# Claim 2: Basic Pitch at L2 (rp linear grid, hop 256) on the rp_all stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: basicpitch_l2
  - override /loss: salience_layers_rp_h256
  - override /metrics: salience_layers_rp_h256
  - override /validation: rp_real
  - _self_

experiment_name: rp_basicpitch_l2_all
batch_size: 128
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_all.yaml
optim:
  lr: 3.0e-3  # LR range test rp_basicpitch_l2_all: never rises, floor at 4.8e-3
