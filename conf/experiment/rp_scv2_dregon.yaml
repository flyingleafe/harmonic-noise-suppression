# @package _global_
# Claim 5: cross-drone transfer, SimpleConv-v2 regressor trained on the rp_dregon stream. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: hb_scv2_mag_nogate
  - override /loss: pit_mse
  - override /metrics: rps
  - override /validation: rp_real
  - _self_

experiment_name: rp_scv2_dregon
batch_size: 128
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_dregon.yaml
optim:
  lr: 3.0e-4  # LR range test rp_scv2_all: loss non-finite at 3.5e-3 (fp16 forward), a tenth of it
