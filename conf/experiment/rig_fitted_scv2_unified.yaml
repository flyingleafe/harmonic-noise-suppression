# @package _global_
# SCv2 on the FITTED stochastic presets under the unified regime — the transfer
# test of the whole fitting campaign. Same regime as rig_fm_scv2_unified (2 s
# clips, batch 128, full-panel validation/stopping, synthetic only); the stream
# is conf/online_mix/rig_fitted_5050.yaml, generated by
# `experiments.stochastic_fit.run popexport` from the two rigs' fitted
# summaries, so every preset value here comes from a fit rather than a range
# chosen by hand:
#   profile      decomposed Vold-Kalman envelopes, one-SE rank (Michael's) /
#                Whittle population + training-only topology calibration (DREGON)
#   amplitude    measured OU process (std 2.90 dB, tau 0.82 s, cross-order
#                coherence 0.191) — one component, chosen by leave-one-rotor-out
#                cross-validation with the one-standard-error rule
#   speed laws   line 3.93 dB/dB rps (envelopes), floor 3.46 (VK residual)
#   label error  a static per-rotor shaft-minus-label offset, robust scale
#                0.41 rev/s (Michael's) / 1.38 (DREGON), so the synthetic task
#                carries the same label uncertainty the real one does
# Compared with real_r4_scv2_unified (real data in training; best val/real_r3
# 2.99) and rig_fm_scv2_unified (the pre-fit hand-exported presets: 23.08).
defaults:
  - real_r1_scv2
  - override /validation: rps_unified
  - _self_

experiment_name: rig_fitted_scv2_unified
# fp16 went non-finite at step ~500 on the FM stream (run tgr8l18p); the
# matrix's one-time bf16 policy applies to every FM-tone-bank stream.
amp_dtype: bfloat16
samples_per_validation: null
batch_size: 128
num_workers: 12
data:
  train:
    params:
      path: conf/online_mix/rig_fitted_5050.yaml
      duration_s: 2.0
