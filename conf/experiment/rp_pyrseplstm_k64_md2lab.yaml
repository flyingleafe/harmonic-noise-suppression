# @package _global_
# Transfer between drones: HRSPNet (pyramid + separable ConvLSTM, k <= 64) on the rp_md2_labelaug stream, scored on DREGON. Batch doc: docs/experiments/paper-real-protocol.md.
defaults:
  - override /data: rp_real
  - override /model: hppnet_pyrseplstm_k64
  - override /loss: salience_layers_rp
  - override /metrics: salience_layers_rp
  - override /validation: rp_real
  - _self_

experiment_name: rp_pyrseplstm_k64_md2lab
batch_size: 128  # no accumulation anywhere (Dmitrii, 2026-10-15): needs an A100-80 (128 OOMs at 32 GB)
grad_accum_steps: 1
num_workers: 6
data:
  train:
    params:
      path: conf/online_mix/rp_md2_labelaug.yaml
optim:
  lr: 1.0e-3  # the max LR of published practice (HarmoF0, Cuesta 2020, Quiet Drones 2026: 1e-3; HPPNet 6e-4 at batch 4); range tests -> appendix
validation:
  control: [md2]  # stop on the training drone only; the held-out drone never steers the run
