# Validation twin of conf/loss/salience_layers_log36_h256.yaml (Basic Pitch L1:
# 264-bin contour grid from 27.5 at 36 per octave + the off state, hop 256).
# See conf/metrics/salience_layers_rp.yaml for what the two terms are.
terms:
  - name: bce
    _target_: metrics.LayerPITSalienceBCEMetric
    params:
      grid: {kind: log_off, fmin: 27.5, bins_per_octave: 36, n_bins: 264}
      n_layers: 4
      sigma_rev_s: 1.0
      focus: auto
      rate: [16000, 256]
  - name: rps_mae
    _target_: metrics.LayerPeakRPSMetric
    params:
      grid: {kind: log_off, fmin: 27.5, bins_per_octave: 36, n_bins: 264}
      n_layers: 4
      sigma_rev_s: 1.0
      rate: [16000, 256]
