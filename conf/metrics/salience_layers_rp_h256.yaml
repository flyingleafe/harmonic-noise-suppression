# Validation twin of conf/loss/salience_layers_rp_h256.yaml: conf/metrics/
# salience_layers_rp.yaml on the hop-256 time grid of the two multi-pitch
# baselines (conf/model/{basicpitch,latedeep}_l2.yaml).
terms:
  - name: bce
    _target_: metrics.LayerPITSalienceBCEMetric
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 159.1796875, bins: 164}
      n_layers: 4
      sigma_rev_s: 1.0
      focus: auto
      rate: [16000, 256]
  - name: rps_mae
    _target_: metrics.LayerPeakRPSMetric
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 159.1796875, bins: 164}
      n_layers: 4
      sigma_rev_s: 1.0
      rate: [16000, 256]
