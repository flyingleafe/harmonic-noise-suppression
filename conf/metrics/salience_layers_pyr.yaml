# Validation twin of conf/loss/salience_layers_pyr.yaml (the LEGACY 307-bin
# pyramid grid, 0 -> 298.828125 rev/s; serves only
# conf/model/hppnet_pyramid_convlstm_r4legacy.yaml). See
# conf/metrics/salience_layers_rp.yaml for what the two terms are.
terms:
  - name: bce
    _target_: metrics.LayerPITSalienceBCEMetric
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 298.828125, bins: 307}
      n_layers: 4
      sigma_rev_s: 0.9765625
      focus: 122.0
      rate: [16000, 512]
  - name: rps_mae
    _target_: metrics.LayerPeakRPSMetric
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 298.828125, bins: 307}
      n_layers: 4
      sigma_rev_s: 0.9765625
      rate: [16000, 512]
