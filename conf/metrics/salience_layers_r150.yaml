# Validation twin of conf/loss/salience_layers_r150.yaml (the retired L3 ports'
# 300-bin 0-150 rev/s grid). That file carries the grid argument and the reason
# `pos_weight` is absent; conf/metrics/salience_layers_rp.yaml says what the two
# terms are.
terms:
  - name: bce
    _target_: metrics.LayerPITSalienceBCEMetric
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 150.0, bins: 300}
      n_layers: 4
      sigma_rev_s: 0.50167224
      focus: 120.0  # mirrors the loss; `rps_mae` is focus-free by construction
      rate: [16000, 512]
  - name: rps_mae
    _target_: metrics.LayerPeakRPSMetric
    params:
      grid: {kind: linear, fmin: 0.0, fmax: 150.0, bins: 300}
      n_layers: 4
      sigma_rev_s: 0.50167224
      rate: [16000, 512]
