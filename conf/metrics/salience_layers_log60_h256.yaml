# Validation twin of conf/loss/salience_layers_log60_h256.yaml (LateDeep L1:
# 360-bin HCQT grid from 32.7 at 60 per octave + the off state, hop 256).
# See conf/metrics/salience_layers_rp.yaml for what the two terms are.
terms:
  - name: bce
    _target_: metrics.LayerPITSalienceBCEMetric
    params:
      grid: {kind: log_off, fmin: 32.7, bins_per_octave: 60, n_bins: 360}
      n_layers: 4
      sigma_rev_s: 1.0
      focus: auto
      rate: [16000, 256]
  - name: rps_mae
    _target_: metrics.LayerPeakRPSMetric
    params:
      grid: {kind: log_off, fmin: 32.7, bins_per_octave: 60, n_bins: 360}
      n_layers: 4
      sigma_rev_s: 1.0
      rate: [16000, 256]
