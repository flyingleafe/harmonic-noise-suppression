# ARM STREAM: the ROUND-4 HARD BANK (noise-v3r4-banks: speed laws (6, 6),
# per-rotor tonality guard, standby on every entry, array-response coin 0.5)
# on the LEGACY hard trajectory sampler (full_flight, aggressiveness 1.0,
# profile blend [0, 1], per-window scale [0.45, 1.2]).
# conf/online_mix/noise_v2_hard_legacytraj_5050.yaml with only the bank
# changed. Against noise_v3r4plain6_hard_legacytraj_5050.yaml it adds the rest
# of the round-4 bank policy (guard, standby always, array response).
# Reading: docs/experiments/noise-model-v3.md § Round 4 "Legacy-trajectory arms".
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v3r4-banks@77ff7d7f6b67d65fb4fc113840c9fd532973cc38af79824b1ec219756b4d5bd0/noise_v3r4_hard_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 0.45
    - 1.2
    drone_profile_range:
    - 0.0
    - 1.0
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: full_flight
      aggressiveness: 1.0
      flight_reuse: 32
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
