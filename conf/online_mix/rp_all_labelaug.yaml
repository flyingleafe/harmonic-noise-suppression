# PAPER REAL-DATA PROTOCOL, stream `all-labelaug` (experiment suffix `alllab`;
# docs/experiments/paper-real-protocol.md). Identical to rp_all.yaml plus the
# label-altering `noise_rate_warp`.
#
# SOURCES. DREGON `in_flight_noise` minus `free-flight_nosource_room1` (the
# five room-2 flights, `motors_command`) + MD2 FLY125 (calibrated), both at
# `min_motor_rps: 0.0`, merged duration-weighted (pool weight 2); silence arm
# 0.4 / 2.4 = 16.7 % of noise chunks; LibriSpeech train-clean-100, an
# independent utterance per channel.
#
# SCHEDULE UNITS. `ramp.from`/`ramp.until` are GLOBAL SAMPLE IDS (chunks of 8
# mics). One optimizer step = 128 mono frames = 16 chunks, so gid = 16 x step;
# 100k steps = 1.6 M chunks.
#   5 % =  80 000 gids =  5 000 steps    10 % = 160 000 gids = 10 000 steps
#  20 % = 320 000 gids = 20 000 steps    35 % = 560 000 gids = 35 000 steps
# Cosine ramps in the severity parameter: speech SNR upper bound -30 -> +5 dB
# over 10-35 %; random_reverb DRR lower bound 15 -> 3 dB over 5-20 %.
# random_gain, spectral_recolor and noise_rate_warp at full strength from 0.
#
# noise_rate_warp: ONE time-varying resampling of the native 44.1 kHz noise,
# alpha(t) = alpha0 (c + a sin(2 pi f t + phi)), alpha0 ~ U(0.5, 1.5),
# c ~ U(1 +- 0.08), a ~ U(0, 0.04), f ~ U(0.1, 1) Hz; labels
# r~(t) = alpha(t) r(tau(t)); decimated to 16 kHz last. It replaces
# freq_scale + noise_time_warp.

sample_rate: 16000
duration_s: 2.0
base_seed: 20261014
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      speech_per_channel: independent
      snr_per_channel: false
      snr_db:
        uniform:
          low: -30.0
          high: {ramp: {from: 160000, until: 560000, start: -30.0, end: 5.0, shape: cosine}}
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        - probability: 0.5
          choices:
            - spectral_recolor: {}
        - probability: 0.5
          choices:
            - random_reverb:
                rt60_low: 0.1
                rt60_high: 0.8
                drr_db_low: {ramp: {from: 80000, until: 320000, start: 15.0, end: 3.0, shape: cosine}}
                drr_db_high: 15.0
      noise_rate_warp:
        probability: 1.0
        alpha_low: 0.5
        alpha_high: 1.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
