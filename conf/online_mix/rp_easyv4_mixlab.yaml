# MIXED STREAM `easyv4-mixlab` (experiment suffix `easyv4_mixlab`; Dmitrii,
# 2026-10-29): half rp_easyv4.yaml (synthetic drones drawn around the two
# fits), half rp_all_labelaug.yaml (real DREGON room 2 + MD2 FLY125 with the
# label-altering noise_rate_warp). Trained from scratch; no fine-tuning stage.
#
# SOURCES. The real pool of rp_all_labelaug (merged duration-weighted, pool
# weight 2), the noise_v2 source of rp_easyv4 verbatim at weight 2, and the
# silence arm at 0.8: real 2 / 4.8 = 41.7 %, synthetic 41.7 %, silence 16.7 %
# of noise chunks, i.e. exactly the 50/50 mixture of the two streams (each has
# its silence arm at 0.4 / 2.4 = 16.7 %).
# WARP. noise_rate_warp (p = 1, rp_all_labelaug's parameters) applies to the
# native-rate real chunks only; the synthetic renders are at 16 kHz and pass
# unwarped with their exact labels (online_mixing.build_noise_stream).
# Everything else (2 s clips, LibriSpeech per channel at U(-30, +5) dB,
# random_gain, spectral_recolor) is shared by both parent streams.
# Validation: conf/validation/rp_real_v4easy.yaml.

sample_rate: 16000
duration_s: 2.0
base_seed: 20261029
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: noise_v2
      weight: 2.0
      n_mics: 8
      n_rotors: 4
      preset_bank: dload:easy-v4-banks@80fa07c85d53a38b341a129e4f2994f889d5646d56fb3f6799f1bc669b8d90ad/easy_v4_n2048.npz
      render_reuse: 40
      render_duration_s: 4.0
      rps_scale_range: [1.0, 1.0]
      normalize_rms_range: [0.02, 0.25]
      level_mode: flight
      line_scatter_db: 3.4
      rps:
        kind: fitted_traj
        fits: dload:rps-traj-fits
        rigs: {posterior: 1.0}
        mean_shift: [0.0, 0.0]
        hover_range: [35.0, 95.0]
        rotor_sep: [2.0, 15.0]
        rps_max: 150.0
        measurement_noise: false
        shrink: {rigs: [dregon, michaels], weight: 0.57}
        flight_fs: 200
        flight_reuse: 32
        phases: {takeoff_s: [0.6, 1.6], landing_s: [0.25, 0.8]}
    - kind: silence
      weight: 0.8
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      speech_per_channel: independent
      snr_per_channel: false
      snr_db:
        uniform: {low: -30.0, high: 5.0}
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        probability: 0.5
        choices:
          - spectral_recolor: {}
      noise_rate_warp:
        probability: 1.0
        alpha_low: 0.5
        alpha_high: 1.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
