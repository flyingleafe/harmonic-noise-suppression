# HONEST BASE + SILENCE, REFINED LABELS. Byte-for-byte hb_silence_dload.yaml
# except that both real arms carry `rps_key: rps_refined`, so the rotor-speed
# TARGET is the regime-gated F_VK/L-BFGS refined label instead of the raw
# telemetry. Nothing else moves: same recordings, same envelope, same silence
# arm, same SNR floor, same warm-up boundary, same augmentations, same seed.
#
# The point is the label, not the audio. DREGON's telemetry carries a
# scale-like error of 0.3-0.8 % of rate; on a FLY125 cruise window the refined
# track differs from the raw one by up to 1.52 rev/s (mean 0.16). If the
# DREGON-vs-Michael's tracking gap is training-label noise, this pool closes it.
#
# Refinement is REGIME-GATED (data_processing/rps_gating.py): below 45 rev/s
# `rps_refined` IS the telemetry, bit-identical; settled cruise (>= 65 rev/s)
# takes the refinement exactly; the ramp blends the correction. So only the
# CRUISE part of the label can move here — the zero/below-30/standby arms of
# this pool are unchanged by construction, and the silence arm's labels are
# exactly zero either way.
#
# `rps_key` is explicit, not a preference: a labelled recording that did not
# publish `rps_refined` raises instead of falling back to telemetry, because a
# pool that mixed both label definitions would not be comparable to the gate.
#
# Everything below this line is hb_silence_dload.yaml verbatim (plus the two
# `rps_key` entries). Its own rationale, unchanged and still in force:
#
# (1) A zero-labeled SILENCE arm (kind: silence, 0.4 against the merged real
# weight 2.0 = 16.7% of noise chunks). Each chunk is one of three floors: quiet
# room tone (RMS 5e-4 to 5e-3, the measured level of a real stopped-rotor
# span), colored noise up to flight level (RMS 5e-3 to 8e-2), or a low-frequency
# rumble (a 30-60 Hz band edge, 30-120 Hz wide, RMS 1e-2 to 8e-2). The rumble
# reproduces a real failure: a validation clip with stopped rotors that peaks at
# 41-50 Hz. The rotor-speed label of every silence chunk is exactly zero, and
# loud floors teach that an off state is not the same as a quiet sample.
#
# (2) A reference-power floor on the speech scaling (snr_ref_floor_rms 0.02).
# The mixer scales the speech ONTO the noise power, so a near-silent noise chunk
# drags the whole sample down and every zero-RPS sample becomes globally quiet.
# The floor keeps the sample level usable while the noise stays quiet.
#
# Everything else is e12_fullflight_freqscale_v2_dload.yaml: the freq-scale-only
# noise augmentation (alpha in [0.7, 1.3], p = 1.0 after the 50k unaugmented
# warm-up), the 50% post-mix augmentation, and the 50% time warp.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
      rps_key: rps_refined
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
      rps_key: rps_refined
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    # Stage boundary in GENERATED CHUNKS. Under the legacy-equivalent epoch
    # semantics (samples_per_validation 40000 frames = 5000 chunks/epoch at 8
    # mics, batch_size 128 frames = 16 chunks) this is epoch 10 — the boundary
    # the value always intended. The data-level flatten refactor had silently
    # redefined epochs to 5000 FRAMES (625 chunks), pushing this to epoch ~80
    # (docs/experiments/ckla.md § THE STAGING BUG); the fix is restoring epoch
    # semantics, not rescaling the boundary.
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward: same mixture distribution; augment 50% of samples, and
    # independently time-warp 50% of noise chunks (noise+RPS pair) — matches the
    # E5/E11 time-warp recipe exactly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED (2026-07-27): with flatten_channels each
          # zeroed channel becomes a mono training frame of pure silence
          # carrying nonzero RPS labels (~2% of post-warmup frames) —
          # contradicts the silence==zero-RPS convention and trains
          # prior-regression. Designed for multichannel models; harmful here.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
