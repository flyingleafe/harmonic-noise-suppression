# SYNTHETIC STREAM `stochcomb`: the STOCHASTIC COMB of the simplistic-synthetic
# ablation (paper Table VIII; Dmitrii, 2026-11-01: the module's default family).
# rp_combdiv.yaml with only the noise engine swapped: kind: stochastic
# (src/data_processing/stochastic_rotor_noise.py), StochasticRanges defaults.
#
# AUDIO, per window: S(f, t) = B(f, t) + sum_r sum_k P_rk(t) L(f - k rps_r(t);
# gamma_rk). One Lorentzian line per harmonic (half width gamma0 0.5-4 Hz +
# 0.05-0.8 Hz per order, scaled with the drone's hover), rendered as filtered
# noise (line_mode stochastic); a static per-rotor profile (roll-off, jitter,
# blade emphasis, rotor similarity) plus a Gaussian-process drift of every line
# (0.5-6 dB, 0.3-6 s, coherence 0-1 with its rotor's common process); a smooth
# coloured floor 2-22 dB under the typical line, its level and tilt drifting
# too; at least 30 % of the in-band lines above the floor. Every process is
# drawn independently of the trajectory, so the comb's spacing is the only
# speed cue. Every window draws its own profile, floor colour, widths and drift
# rates.
# KEPT FROM rp_combdiv (so the two combs differ only in the audio): the
# trajectory block (the hard setup's reduced hyperprior and measured ramps),
# the level law speed^2.5 (referenced to 80 rev/s there and to the drone's hover
# here, the same after the per-render normalisation) with no recording-chain
# floor (a stopped rotor is silent), each 4 s render normalised to RMS 0.1,
# mic gains -4..0 dB,
# the comb to Nyquist with a 0.1 band taper (orders sized from the window's
# slowest turning rotors, up to 500), 4 s renders reused 40 times with each
# draw its own 2 s window, and everything outside `sources.noise`.
# Render cost: 0.23 CPU-s per 4 s x 8-mic render (rp_combdiv 0.11), measured
# 2026-11-01. Validation: conf/validation/rp_real_stochcomb.yaml.

sample_rate: 16000
duration_s: 2.0
base_seed: 20261101
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: stochastic
      weight: 2.0
      n_mics: 8
      n_rotors: 4
      n_harm_max: 500
      band_taper_frac: 0.1
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      mic_gain_db: [-4.0, 0.0]
      normalize_rms: 0.1
      level_mode: window
      line_mode: stochastic
      render_reuse: 40
      render_duration_s: 4.0
      rps:
        kind: fitted_traj
        fits: dload:rps-traj-fits
        rigs: {posterior: 1.0}
        mean_shift: [0.0, 0.0]
        hover_range: [35.0, 95.0]
        rotor_sep: [2.0, 15.0]
        rps_max: 150.0
        measurement_noise: false
        shrink: {rigs: [dregon, michaels], weight: 0.57}
        flight_fs: 200
        flight_reuse: 32
        phases: {takeoff_s: [0.6, 1.6], landing_s: [0.25, 0.8]}
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      speech_per_channel: independent
      snr_per_channel: false
      snr_db:
        uniform: {low: -30.0, high: 5.0}
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        probability: 0.5
        choices:
          - spectral_recolor: {}
