# SYNTHETIC STREAM `priorv4`: the paper grid's HARD setup (Dmitrii, 2026-10-23;
# grid approved 2026-10-26). rp_combdiv.yaml with the diverse static comb
# replaced by drones of the WIDE PRIOR in noise model v4.
#
# BANK: `prior-v4-banks` prior_v4_n16384.npz, 16 384 draws of
# experiments.noise_model.prior_v4.sample_prior_v4 (seed 20261024; the
# prior_v1 laws mapped to v4 by RULES prior_v4/4, phase pedestal per order)
# kept by the identifiability gate (2 dB / 3 orders / 90 % of frames);
# scripts/prior_bank_v4_build.py, omnirun prior-v4-bank-a14f5a, 52.4 % kept.
# The rigs carry no wind: v1's per-clip SC wind law is `wind_sc` below, and
# v1's per-clip (mic, line) scatter `mic_dev_sd_db` 3.4 dB is
# `line_scatter_db` (render-time augmentations, drawn fresh per render).
# LEVEL: prior_v1's rule (noise_prior_v1_5050.yaml): log-uniform 0.02-0.25 at
# the reference speed, the window's own floor envelope kept (level_mode flight).
# TRAJECTORY: rp_combdiv's (the reduced hyperprior: hover U[35, 95], rotor_sep
# [2, 15], rps_max 150, shrink 0.57 toward DREGON + michaels, measured
# take-off / landing ramps, no measurement process).
# RENDERS: 4 s, reused 40 times, each draw its own 2 s window (0.026 s of one
# CPU per 2 s draw, measured 2026-10-26; prior_v1's 0.027).
# Everything outside `sources.noise` is rp_combdiv's (= rp_all's): 2 s clips,
# the silence arm at 0.4 / 2.4, LibriSpeech train-clean-100 per channel at
# U(-30, +5) dB, random_gain and spectral_recolor at p 0.5, no label
# augmentation. Validation: conf/validation/rp_real_priorv4.yaml.

sample_rate: 16000
duration_s: 2.0
base_seed: 20261027
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: noise_v2
      weight: 2.0
      n_mics: 8
      n_rotors: 4
      preset_bank: dload:prior-v4-banks@2ee5131ebe73d74b580798fa042e5e29f6bbdb0acf49f96f4f4159aea8df262b/prior_v4_n16384.npz
      render_reuse: 40
      render_duration_s: 4.0
      rps_scale_range: [1.0, 1.0]
      normalize_rms_range: [0.02, 0.25]
      level_mode: flight
      line_scatter_db: 3.4
      wind_sc: {p_wind: 0.7, max_over_floor_db: 33.0, shield_mean_db: 8.0, gustiness: 3}
      rps:
        kind: fitted_traj
        fits: dload:rps-traj-fits
        rigs: {posterior: 1.0}
        mean_shift: [0.0, 0.0]
        hover_range: [35.0, 95.0]
        rotor_sep: [2.0, 15.0]
        rps_max: 150.0
        measurement_noise: false
        shrink: {rigs: [dregon, michaels], weight: 0.57}
        flight_fs: 200
        flight_reuse: 32
        phases: {takeoff_s: [0.6, 1.6], landing_s: [0.25, 0.8]}
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      speech_per_channel: independent
      snr_per_channel: false
      snr_db:
        uniform: {low: -30.0, high: 5.0}
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        probability: 0.5
        choices:
          - spectral_recolor: {}
