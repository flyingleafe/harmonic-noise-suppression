# ARM: NOISE-MODEL-V3 ROUND-3 HARD -- conf/online_mix/noise_v3_hard_5050.yaml
# with the round-2 v3 fits replaced by the round-3b fits, and NOTHING else
# changed.
#
# DERIVED from conf/online_mix/noise_v3_hard_5050.yaml (itself
# noise_v2_hard_5050.yaml with only the bank line changed). The two files
# differ in ONE line, `preset_bank`, and in this header. Every other key is
# the v2 hard policy's; that file's header explains each one. The trajectory
# is the rig HYPERPRIOR (`rigs: {posterior: 1}`, every entry `traj_rig:
# null`), truncated by `rps_max: 150`, with `rps_scale_range: [1.0, 1.0]`.
#
# THE BANK. It has 2048 entries, a `noise-v2-bank/1` container of
# `noise-v3-fit/1` payloads. It was built by `scripts/noise_v2_build_bank.py
# --preset hard --generation v3r3`: sampler generation v3's construction
# (seed 20260921, spread 3.0, the v2 widths, guards and LTAS envelope, the
# anchor-relative trend guard) on the CRUISE <-> CRUISE path between the
# round-3b v3 fits with their static latent part folded into the rig
# (results/noise_v3/diag/folded_r3, commit b2c3f31b). t ~ U[0, 1] on the
# common order range K = 1..81. The standby slot and the wander block are
# CARRIED with probability t (Michael's), otherwise none / DREGON's. Every
# wander block carries the u_j kernel prior (`uj_corr_oct: 1.5`), which the
# renderer reads. The full conventions are in the bank's
# `provenance.path_interp`.
#
# THE BANK TRAVELS AS A PINNED DATASET, `noise-v3r3-banks`, exactly as the
# v2 and v3 banks do. The `preset_bank` below names the file inside it WITH
# ITS VERSION, and the same pin sits in `dload.lock`. A job pulls it once
# (`dload pull noise-v3r3-banks`) before train.py. The build report rides in
# the same tree as build_hard.json.
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v3r3-banks@500de70d211260b17af310a0a64c14616981552203b1fff4a497600552a282a8/noise_v3r3_hard_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 1.0
    - 1.0
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        posterior: 1
      mean_shift:
      - -5.0
      - 5.0
      flight_fs: 200
      flight_reuse: 32
      rps_max: 150
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
