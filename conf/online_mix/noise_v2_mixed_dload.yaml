# THE JOINT MIXED REGIME with the NOISE-MODEL-V2 HARD family as the synthetic
# half. This is conf/online_mix/hb_stochmixed_dload.yaml with its stochastic +
# static-comb pair replaced by the ONE `kind: noise_v2` source of
# conf/online_mix/noise_v2_hard_5050.yaml, and nothing else touched.
#
# WHAT IS VERBATIM FROM WHERE.
# (1) The real block and the honest silence arm are hb_stochmixed_dload.yaml's
#     (themselves hb_m3mixed_dload.yaml's), unchanged: the DREGON
#     `in_flight_noise` pool minus `free-flight_nosource_room1` plus Michael's
#     FLY125, both at `min_motor_rps: 0.0` so the whole envelope stays in,
#     merged at pool weight 2.0 (unweighted `kind: frames` sources merge into
#     one duration-weighted pool whose weight is the number of merged items),
#     plus the zero-labeled silence arm at weight 0.4. The SNR reference floor
#     (0.02), `sample_rate`, `duration_s` and `base_seed` come with them.
# (2) The synthetic source is noise_v2_hard_5050.yaml's, unchanged except its
#     weight: the hard preset bank, `render_reuse: 192`, `rps_scale_range:
#     [1.0, 1.0]`, the `posterior` hyperprior trajectory with
#     `mean_shift: [-5, 5]` under the `rps_max: 150` flight cap, and the
#     [0.02, 0.25] / `level_mode: flight` level draw. Read that file's header
#     for why each of those is what it is -- in particular that the cap is a
#     measured TRUNCATION of the hyperprior (acceptance 0.296) which moves the
#     hover level (z = -33.2 on the log-scale coordinate) and leaves all 31
#     shape/dynamics coordinates unmoved (max |z| = 1.71).
# (3) The policy block -- one stage, no warm-up, gain/polarity + `freq_scale` +
#     the noise time warp from sample 1 -- is hb_stochmixed_dload.yaml's.
#
# THE RATIO IS PRESERVED. hb_stochmixed is real 2.0 : silence 0.4 :
# stochastic 1.0 : comb 1.0. This is real 2.0 : silence 0.4 : noise_v2 2.0 --
# the same 45.5 / 9.1 / 45.5 split, with the fitted v2 family standing exactly
# where the stochastic + comb pair stood. ONE source rather than two: the two
# it replaces were two DIFFERENT families (a stochastic rig and a static
# comb), while one v2 bank already carries the whole rig population, so a
# second source would be a second live render of the SAME distribution. That
# costs a second warm-up and a second resident render at 1973 ms per 2 s x 8
# mics against the legacy 416 ms (results/noise_v2/stream_bench/) and changes
# nothing that is sampled — the steady-state render rate is set by
# `render_reuse` and the source's own weight, not by the number of sources.
# `render_reuse: 192` is what keeps the FRESH-RENDER RATE per wall-clock at
# the legacy arms' level.
#
# WHY THE HARD BANK AND NOT THE EASY ONE. The real half of this stream already
# contains both evaluation rigs as recordings. A synthetic half drawn from
# neighbourhoods of those same two rigs would add little the real half does not
# already carry; the hard bank adds rigs and flights that are in neither.
#
# THE BANK TRAVELS AS A PINNED DATASET: `noise-v2-banks` (seed 20260921,
# strength 3.0), version 7f6a3242b353... written into `preset_bank` below
# and into the committed `dload.lock`, pulled once per job. See
# conf/online_mix/noise_v2_hard_5050.yaml.
#
# USED BY: nv2_mixed_scv2, nv2_mixed_hppnet_l2.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    # --- 45.5% (2.0 of 4.4): the REAL recordings, whole envelope ---
    # No explicit weight: these two merge into ONE duration-weighted real pool
    # at pool weight 2.0.
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0

    # --- 9.1% (0.4 of 4.4): the honest zero-labeled SILENCE arm (R2) ---
    # Each chunk is one of three floors: quiet room tone, a colored floor up to
    # flight level, or a low-frequency rumble. The label is exactly zero.
    - kind: silence
      weight: 0.4
      n_channels: 8

    # --- 45.5% (2.0 of 4.4): the FITTED v2 HARD family, one source ---
    - kind: noise_v2
      weight: 2.0
      n_mics: 8
      n_rotors: 4
      preset_bank: dload:noise-v2-banks@7f6a3242b353b1d0806f2add1ee0826dbc8032e904d9ae9825cf4c1d064d2925/noise_v2_hard_n2048.json
      render_reuse: 192
      rps_scale_range: [1.0, 1.0]
      normalize_rms_range: [0.02, 0.25]
      level_mode: flight
      rps:
        kind: fitted_traj
        fits: dload:rps-traj-fits
        rigs: {posterior: 1}
        mean_shift: [-5.0, 5.0]
        flight_fs: 200
        flight_reuse: 32
        rps_max: 150

    # NOTE the v2 arms' own `kind: silence` source (weight 0.2) is REMOVED
    # here, exactly as hb_stochmixed_dload.yaml removes arm ID's: the real
    # block above already carries the honest silence arm at weight 0.4, and
    # keeping both would put 0.6 of silence in the pool against the intended
    # 0.4, changing the ratio this arm is meant to hold fixed.

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    # ONE stage, no warm-up: mixtures + all three augmentation blocks from
    # sample 1 (identical to hb_stochmixed_dload).
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED: with flatten_channels each zeroed channel
          # becomes a mono frame of pure silence carrying nonzero RPS labels,
          # contradicting the silence==zero-RPS convention.
      noise_augmentations:
        probability: 1.0
        choices:
          # `rps_max` bounds the AUGMENTED LABEL, which the source-level
          # `rps.rps_max: 150` cannot: freq_scale multiplies the labels by
          # alpha, so a 150-capped flight would reach 195 rev/s at
          # alpha_high 1.3 -- off the salience trunks' 0-150 rev/s grid. With
          # it, this frame's upper bound is min(1.3, 150 / max rps in the
          # frame); a frame that cannot take even alpha_low passes through at
          # alpha = 1. Real-source frames are far below the ceiling and are
          # untouched.
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3, rps_max: 150}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
