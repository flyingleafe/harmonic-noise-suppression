# ARM: FITTED TRAJECTORIES -- the rig timbres of rig_easy_5050 flown on the
# FITTED rotor-speed model instead of the hand-written scaffold.
# DERIVED from conf/online_mix/rig_easy_5050.yaml -- do not hand-edit; it is a
# mechanical rewrite of that policy in which each stochastic source's `rps:`
# block is replaced and NOTHING else moves. The preset bank (the rig identity:
# timbre, floor shape, line widths, per-(mic, rotor) pattern and the fitted
# speed law), the weights, `rps_scale_range`, `render_reuse`, the level draw,
# the silence source, the speech source and the mixing policy are that
# policy's.
#
# What moves: the trajectory the audio is rendered FROM.
# `kind: full_flight` drew the airborne phase from
# `data_processing.rps_synthesis` -- telegraph set-points plus an OU jitter,
# with ranges chosen by eye. `kind: fitted_traj` draws it from the
# exact-likelihood MAP fits of the campaign's generative model
# (docs/experiments/rps-trajectory-model.md, dataset `rps-traj-fits`):
# per control mode an OU plus a damped oscillator, one measurement OU per
# rotor, one level offset per flight, and the rig's own measured ESC floor and
# ceiling as the clamp. The full-flight ENVELOPE is unchanged -- ground,
# spin-up, warm-up idle, take-off, airborne, landing, spin-down, ground, with
# the same `FlightPhaseRanges` durations -- so the stream still visits the
# low-/zero-speed regimes in the same proportions, and `flight_fs` /
# `flight_reuse` still mean what they meant.
#
# `rigs:` is a weighted mixture drawn per FLIGHT. `michaels` and `dregon` are
# the two rigs the models are evaluated on (weight 1 each); `posterior` is the
# reserved name for the GLOBAL fit -- the diagonal Gaussian over all seven
# fitted rigs in scale-free coordinates -- and draws a FRESH drone per flight
# (weight 1), so half the flights are one of the two evaluation rigs and half
# are a drone that has never been built. That keeps the 50/50 spirit of the
# base policy at the level of trajectories.
#
# `mean_shift: [-5, 5]` moves the whole hover level by one draw per flight
# (rev/s, all four rotors), and the ESC clamp and the warm-up idle level move
# with it. It exists because a fit's `mu` is ONE aircraft's one operating
# point: without the shift every michaels flight in the stream hovers at
# exactly 78.4 rev/s. It is deliberately small next to the base policy's
# `rps_scale_range` (0.45-1.2), which is the multiplicative knob and stays.
#
# Both stochastic sources carry the same block, exactly as they carry the same
# bank: that preserves the base policy's 0.4 / 0.4 / 0.2 weights and its TWO
# independent render pools, so the reuse regime is unchanged.
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: stochastic
    weight: 0.4
    line_mode: fm
    n_harmonics: 80
    render_reuse: 48
    n_mics: 8
    n_rotors: 4
    drone_profile_range:
    - 0.0
    - 1.0
    mic_gain_db:
    - -7.0
    - 0.0
    amp_rps_exponent: 2.5
    amp_rps_ref: 80.0
    rps_scale_range:
    - 0.45
    - 1.2
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        michaels: 1
        dregon: 1
        posterior: 1
      mean_shift:
      - -5.0
      - 5.0
      flight_fs: 200
      flight_reuse: 32
    amp_rps_exponent_floor: 2.5
    preset_bank: data/rig_banks/rig_easy_n2048.json
  - kind: stochastic
    weight: 0.4
    line_mode: fm
    n_harmonics: 80
    render_reuse: 48
    n_mics: 8
    n_rotors: 4
    drone_profile_range:
    - 0.0
    - 1.0
    mic_gain_db:
    - -8.0
    - 0.0
    amp_rps_exponent: 2.5
    amp_rps_ref: 80.0
    rps_scale_range:
    - 0.45
    - 1.2
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        michaels: 1
        dregon: 1
        posterior: 1
      mean_shift:
      - -5.0
      - 5.0
      flight_fs: 200
      flight_reuse: 32
    amp_rps_exponent_floor: 2.5
    preset_bank: data/rig_banks/rig_easy_n2048.json
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
