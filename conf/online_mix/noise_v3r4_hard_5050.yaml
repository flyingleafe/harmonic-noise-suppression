# ARM: NOISE-MODEL-V3 ROUND-4 HARD -- conf/online_mix/noise_v3r3_hard_5050.yaml
# with the round-4 bank and the round-4 hard TRAJECTORY policy
# (docs/experiments/noise-model-v3.md § Round 4 "Bank policy"). Differences
# from noise_v3r3_hard_5050.yaml, all in the `noise` source:
#
# * `preset_bank`: `noise_v3r4_hard_n2048.json`, built by
#   `scripts/noise_v2_build_bank.py --preset hard --generation v3r4` around the
#   round-4 fits (results/noise_v3/fits_r4, rig-only, no fold) under the
#   mandatory round-4 policy: speed exponents pinned to (6, 6) with each
#   anchor's static fraction, Michael's standby payload on EVERY entry, the
#   per-rotor tonality guard (>= 1 comparable order per rotor on every real
#   cruise pattern at its own speed and at 35 / 50 / 65 rev/s), the array
#   response carried by its own coin (p 0.5). Published as the pinned dload
#   dataset `noise-v3r4-banks` (the pin is in the URI and in dload.lock).
# * `rps.hover_range: [35, 95]`: a posterior drone's hover drawn uniform on
#   the legacy hard operating range on the scale-free coordinates (the
#   hyperprior's own hover median was 142 rev/s, 95th percentile 315);
#   `mean_shift` is therefore [0, 0] (it would push the range past the bounds).
# * `rps.rotor_sep: [2.0, 15.0]`: closest rotor pair >= 2 rev/s, pair mean
#   <= 15 rev/s over the airborne part, by rejection.
# * `rps.rps_max: 120` (was 150): the take-off overshoot cap above the range.
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v3r4-banks@77ff7d7f6b67d65fb4fc113840c9fd532973cc38af79824b1ec219756b4d5bd0/noise_v3r4_hard_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 1.0
    - 1.0
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        posterior: 1
      mean_shift:
      - 0.0
      - 0.0
      hover_range:
      - 35.0
      - 95.0
      rotor_sep:
      - 2.0
      - 15.0
      flight_fs: 200
      flight_reuse: 32
      rps_max: 120
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
