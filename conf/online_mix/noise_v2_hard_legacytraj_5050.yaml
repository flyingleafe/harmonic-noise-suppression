# CONTROL ARM: NOISE-MODEL-V2 HARD BANK on the LEGACY HARD TRAJECTORY SAMPLER.
#
# Question: how much of the legacy hard arm's transfer (5.41) over the v2 hard
# arm (7.06) is the trajectory sampler? This file is
# conf/online_mix/noise_v2_hard_5050.yaml with ONLY the trajectory side
# replaced by conf/online_mix/rig_hard_5050.yaml's: `rps.kind: full_flight`
# (the hand-written scaffold `rps_synthesis.generate_full_flight`,
# aggressiveness 1.0, flight_reuse 32), `drone_profile_range: [0, 1]` and the
# per-window log-uniform speed scale `rps_scale_range: [0.45, 1.2]`. The bank
# (noise-v2-banks hard, every entry `traj_rig: null`, inert under full_flight),
# level draw, silence, speech and mixing policy are the v2 hard arm's.
# Reading: docs/experiments/noise-model-v3.md § Round 4 "Transfer controls".
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v2-banks@7f6a3242b353b1d0806f2add1ee0826dbc8032e904d9ae9825cf4c1d064d2925/noise_v2_hard_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 0.45
    - 1.2
    drone_profile_range:
    - 0.0
    - 1.0
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: full_flight
      aggressiveness: 1.0
      flight_reuse: 32
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
