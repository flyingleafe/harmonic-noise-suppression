# ARM: NOISE-MODEL-V3 EASY -- conf/online_mix/noise_v2_easy_5050.yaml with the
# v2 fits replaced by the round-2 v3 fits, and NOTHING else changed.
#
# DERIVED from conf/online_mix/noise_v2_easy_5050.yaml (the v2 easy arm, best
# real MAE 7.94). The two files differ in ONE line, `preset_bank`, and in this
# header. Every other key is the v2 easy policy's, and that header explains
# each one: one `kind: noise_v2` source at 0.8 plus silence at 0.2,
# `render_reuse: 192`, the flight level rule `normalize_rms_range: [0.02,
# 0.25]`, the fitted trajectory with `mean_shift: [-5, 5]`, `rps_scale_range:
# [0.45, 1.2]`, `rps_max: 150`, the speech source and the mixing policy. The
# `rps.rigs` keys name TRAJECTORY rigs, not noise fits, so they stay as well.
# Every easy entry names its own `traj_rig`.
#
# THE BANK. It has 2048 entries, a `noise-v2-bank/1` container of
# `noise-v3-fit/1` payloads. It was built by `scripts/noise_v2_build_bank.py
# --preset easy --generation v3` with the v2 bank's construction and
# hyperparameters: seed 20260921, strength 3.0, the v2 widths, guards and
# LTAS envelope, and 1024 neighbourhood draws per rig. The draws sit around
# DREGON room-2 and Michael's FLY125 {standby, cruise}. These are the
# round-2 v3 fits with their static latent part folded into the rig
# (results/noise_v3/diag/folded_r2, commit 1b698d78). Without the fold, the
# zero-mean wander the renderer draws drops that static part and adds the
# prior's Jensen term on top. The v2 -> v3 mapping of every perturbed
# coordinate is in `experiments.noise_model.rig_sampler`'s docstring:
# - the floor shape and tilt draws are carried into the spline;
# - DREGON's wind moves with the rig level;
# - the wander hyperparameters are kept, not perturbed;
# - a trend guard applies around Michael's flat-trend rotors.
# The renderer draws fresh block-wander latents per window, at unit mic gains
# because v3 normalises the channels in the data, and at the fit's own 32 kHz
# work rate.
#
# THE BANK TRAVELS AS A PINNED DATASET, `noise-v3-banks`, exactly as the v2
# banks do. The `preset_bank` below names the file inside it WITH ITS
# VERSION, and the same pin sits in `dload.lock`. A job pulls it once
# (`dload pull noise-v3-banks`) before train.py. The build report rides in
# the same tree as build_easy.json.
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v3-banks@8c62fa74428241ace1beb782ec1de2fb442cfcd45bfca2bc72711452284f65ff/noise_v3_easy_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 0.45
    - 1.2
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        dregon: 1
        michaels: 1
      mean_shift:
      - -5.0
      - 5.0
      flight_fs: 200
      flight_reuse: 32
      rps_max: 150
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
