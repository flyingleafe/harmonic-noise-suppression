# PAPER REAL-DATA PROTOCOL, stream `all` (docs/experiments/paper-real-protocol.md).
# Used through conf/data/rp_real.yaml (`data.train.params.path`).
#
# SOURCES. DREGON `in_flight_noise` minus `free-flight_nosource_room1` (= the
# five room-2 flights, labels `motors_command`, cleaned at publish time) and
# MD2 FLY125 (calibrated telemetry), both at `min_motor_rps: 0.0` (whole
# envelope), merged duration-weighted (merged pool weight = 2 = number of
# merged specs). The zero-labelled silence arm at weight 0.4 against that 2.0
# = 0.4 / 2.4 = 16.7 % of noise chunks. LibriSpeech train-clean-100 speech,
# an independent utterance per channel. Validation (DREGON room 1, FLY124)
# and the DREGON test split never appear here.
#
# NO SCHEDULE (Dmitrii, 2026-10-15). The first HPPNet-L2 pilot, trained with
# the speech SNR upper bound ramping -30 -> +5 dB over 10-35 % and a reverb
# DRR ramp, memorised the quiet-speech early regime and collapsed to zeros
# off the memorised clips (saturation stop at 20k steps), unlike every
# earlier unified HPPNet-L2 run, which saw clearly audible mixtures from
# sample 1. So: one stage, everything at full strength from step 0 - speech
# SNR U(-30, +5) dB, random_gain, spectral_recolor.
# random_reverb is dropped altogether: the earlier runs never used it and the
# pitch-estimation literature does not either. No label-altering augmentation
# (that is rp_all_labelaug.yaml).

sample_rate: 16000
duration_s: 2.0
base_seed: 20261014
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      speech_per_channel: independent
      snr_per_channel: false
      snr_db:
        uniform: {low: -30.0, high: 5.0}
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        probability: 0.5
        choices:
          - spectral_recolor: {}
