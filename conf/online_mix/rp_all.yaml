# PAPER REAL-DATA PROTOCOL, stream `all` (docs/experiments/paper-real-protocol.md).
# Used through conf/data/rp_real.yaml (`data.train.params.path`).
#
# SOURCES. DREGON `in_flight_noise` minus `free-flight_nosource_room1` (= the
# five room-2 flights, labels `motors_command`, cleaned at publish time) and
# MD2 FLY125 (calibrated telemetry), both at `min_motor_rps: 0.0` (whole
# envelope), merged duration-weighted (merged pool weight = 2 = number of
# merged specs). The zero-labelled silence arm at weight 0.4 against that 2.0
# = 0.4 / 2.4 = 16.7 % of noise chunks. LibriSpeech train-clean-100 speech,
# an independent utterance per channel. Validation (DREGON room 1, FLY124)
# and the DREGON test split never appear here.
#
# SCHEDULE UNITS. Every `ramp.from`/`ramp.until` is a GLOBAL SAMPLE ID (one
# chunk of 8 mics). One optimizer step = 128 mono frames = 16 chunks x 8 mics,
# so gid = 16 x step; 100k steps = 1.6 M chunks.
#   5 % =  80 000 gids =  5 000 steps    10 % = 160 000 gids = 10 000 steps
#  20 % = 320 000 gids = 20 000 steps    35 % = 560 000 gids = 35 000 steps
# Ramps are cosine in the severity parameter (value = start + (end - start) *
# (1 - cos(pi t)) / 2, t clipped to [0, 1]):
#   - speech SNR upper bound  -30 -> +5 dB over 10-35 % (lower bound -30 fixed);
#   - random_reverb DRR lower bound 15 -> 3 dB over 5-20 %.
# random_gain and spectral_recolor run at full strength from step 0.
# No label-altering augmentation (that is rp_all_labelaug.yaml).

sample_rate: 16000
duration_s: 2.0
base_seed: 20261014
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      speech_per_channel: independent
      snr_per_channel: false
      snr_db:
        uniform:
          low: -30.0
          high: {ramp: {from: 160000, until: 560000, start: -30.0, end: 5.0, shape: cosine}}
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        - probability: 0.5
          choices:
            - spectral_recolor: {}
        - probability: 0.5
          choices:
            - random_reverb:
                rt60_low: 0.1
                rt60_high: 0.8
                drr_db_low: {ramp: {from: 80000, until: 320000, start: 15.0, end: 3.0, shape: cosine}}
                drr_db_high: 15.0
