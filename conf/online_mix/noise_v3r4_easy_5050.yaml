# ARM: NOISE-MODEL-V3 ROUND-4 EASY -- conf/online_mix/noise_v3r3_easy_5050.yaml
# with the round-4 bank and NOTHING else changed: `preset_bank` is
# `noise_v3r4_easy_n2048.json`, built by `scripts/noise_v2_build_bank.py
# --preset easy --generation v3r4` around the round-4 fits
# (results/noise_v3/fits_r4, rig-only, no fold) under the mandatory round-4
# policy (speed exponents pinned to (6, 6) with each anchor's static fraction;
# Michael's entries carry the measured array response). Published as the
# pinned dload dataset `noise-v3r4-banks` (the pin is in the URI and dload.lock).
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v3r4-banks@77ff7d7f6b67d65fb4fc113840c9fd532973cc38af79824b1ec219756b4d5bd0/noise_v3r4_easy_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 0.45
    - 1.2
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        dregon: 1
        michaels: 1
      mean_shift:
      - -5.0
      - 5.0
      flight_fs: 200
      flight_reuse: 32
      rps_max: 150
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
