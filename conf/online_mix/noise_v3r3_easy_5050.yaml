# ARM: NOISE-MODEL-V3 ROUND-3 EASY -- conf/online_mix/noise_v3_easy_5050.yaml
# with the round-2 v3 fits replaced by the round-3b fits, and NOTHING else
# changed.
#
# DERIVED from conf/online_mix/noise_v3_easy_5050.yaml (itself
# noise_v2_easy_5050.yaml with only the bank line changed). The two files
# differ in ONE line, `preset_bank`, and in this header. Every other key is
# the v2 easy policy's; that file's header explains each one.
#
# THE BANK. It has 2048 entries, a `noise-v2-bank/1` container of
# `noise-v3-fit/1` payloads. It was built by `scripts/noise_v2_build_bank.py
# --preset easy --generation v3r3`: sampler generation v3's construction
# (seed 20260921, strength 3.0, the v2 widths, guards and LTAS envelope, the
# anchor-relative trend guard, 1024 neighbourhood draws per rig) around the
# round-3b v3 fits with their static latent part folded into the rig
# (results/noise_v3/diag/folded_r3, commit b2c3f31b). The round-3b wander
# blocks carry the u_j kernel prior (`uj_corr_oct: 1.5`), and the renderer
# draws the colour tracks correlated across the floor control points from
# it. Every easy entry names its own `traj_rig`.
#
# THE BANK TRAVELS AS A PINNED DATASET, `noise-v3r3-banks`, exactly as the
# v2 and v3 banks do. The `preset_bank` below names the file inside it WITH
# ITS VERSION, and the same pin sits in `dload.lock`. A job pulls it once
# (`dload pull noise-v3r3-banks`) before train.py. The build report rides in
# the same tree as build_easy.json.
sample_rate: 16000
duration_s: 4.0
base_seed: 20260909
snr_ref_floor_rms: 0.02
sources:
  noise:
  - kind: noise_v2
    weight: 0.8
    n_mics: 8
    n_rotors: 4
    preset_bank: dload:noise-v3r3-banks@500de70d211260b17af310a0a64c14616981552203b1fff4a497600552a282a8/noise_v3r3_easy_n2048.json
    render_reuse: 192
    rps_scale_range:
    - 0.45
    - 1.2
    normalize_rms_range:
    - 0.02
    - 0.25
    level_mode: flight
    rps:
      kind: fitted_traj
      fits: dload:rps-traj-fits
      rigs:
        dregon: 1
        michaels: 1
      mean_shift:
      - -5.0
      - 5.0
      flight_fs: 200
      flight_reuse: 32
      rps_max: 150
  - kind: silence
    weight: 0.2
    n_channels: 8
  speech:
  - dataset: librispeech
    subpath: LibriSpeech/train-clean-100
policy:
  stages:
  - until: null
    source_prob: 1.0
    snr_db:
      uniform:
        low: -30.0
        high: 0.0
    speech_per_channel: independent
    snr_per_channel: false
    augmentations:
      probability: 0.5
      choices:
      - random_gain:
          min_db: -6.0
          max_db: 6.0
      - random_polarity: {}
