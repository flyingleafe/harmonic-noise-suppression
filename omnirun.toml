# Per-repo omnirun job defaults (CLI flags override). Committed; backend
# definitions (uni, uni-gpushort, uni-cpu, vast, kaggle) live on the omnirun
# daemon — see docs/data-and-artifacts.md § "Job running".

[job]
outputs = ["results/**"]

[job.resources]
gpus = 1
time = "1h"

[job.env]
# Explicit "uv", not "auto": on notebook backends (colab/kaggle) omnirun
# rewrites auto -> system (ambient pip install), losing uv.lock pinning.
# "uv" builds the locked venv everywhere (~4 min on Kaggle, verified).
# kind = "system" also resolves since the s3fs removal, if you prefer to
# reuse the notebook's preinstalled CUDA torch over exact reproducibility.
kind = "uv"
