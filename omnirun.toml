# Per-repo omnirun job defaults (CLI flags override). Committed; backend
# definitions (uni, uni-gpushort, uni-cpu, isambard, vast, kaggle) live on the
# omnirun daemon — see docs/data-and-artifacts.md § "Job running".

[job]
# Collect nothing. Jobs publish explicitly: train.py/eval.py upload their run
# records to r2://ml-data/artifacts/<exp>/ (ArtifactStore) + W&B; any other
# results/<name> is pushed with `python scripts/r2sync.py push results/<name>`.
# A non-empty `--outputs` replaces this list per job — do not pass one: the
# daemon copies outputs to the omnirun-artifacts bucket under the job id, a
# second, job-namespaced copy of everything matched.
outputs = []

[job.resources]
gpus = 1
time = "1h"

[job.env]
# Explicit "uv", not "auto": on notebook backends (colab/kaggle) omnirun
# rewrites auto -> system (ambient pip install), losing uv.lock pinning.
# "uv" builds the locked venv everywhere (~4 min on Kaggle, verified).
# kind = "system" also resolves since the s3fs removal, if you prefer to
# reuse the notebook's preinstalled CUDA torch over exact reproducibility.
kind = "uv"
